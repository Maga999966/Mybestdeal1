      - name: Найти Release и скачать APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p apk

          echo "=== ВСЕ RELEASE ==="
          gh release list --repo "${{ github.repository }}" --limit 20

          echo ""
          echo "=== ПОИСК APK В RELEASE ==="

          gh release list \
            --repo "${{ github.repository }}" \
            --limit 20 \
            --json tagName,name,isDraft,isPrerelease \
            --jq '.[] | "\(.tagName) | \(.name)"'

          echo ""
          echo "=== ПРИКРЕПЛЁННЫЕ ФАЙЛЫ ==="

          for TAG in $(gh release list \
            --repo "${{ github.repository }}" \
            --limit 20 \
            --json tagName \
            --jq '.[].tagName'); do

            echo ""
            echo "Release: $TAG"

            gh release view "$TAG" \
              --repo "${{ github.repository }}" \
              --json assets \
              --jq '.assets[].name' || true
          done

          echo ""
          echo "=== ГОТОВО ==="