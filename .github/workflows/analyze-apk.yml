name: Analyze My Best Deal APK

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip

      - name: Скачать APK из Release v4.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p apk

          echo "=== СКАЧИВАЕМ APK ИЗ RELEASE v4.7 ==="

          gh release download v4.7 \
            --pattern "*.apk" \
            --dir apk

          echo ""
          echo "=== СКАЧАННЫЕ ФАЙЛЫ ==="
          ls -lh apk

      - name: Распаковать APK
        run: |
          set -e

          APK=$(find apk -type f -iname "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo "APK: $APK"

          mkdir -p extracted

          unzip -q "$APK" -d extracted

          echo ""
          echo "=== APK РАСПАКОВАН ==="

      - name: Найти x-game
        run: |
          set -e

          echo "=== ПОИСК x-game ==="

          find extracted -type d -name "x-game" -print

          echo ""
          echo "=== ПОИСК assets ==="

          find extracted -type d -name "assets" -print

          echo ""
          echo "=== RPYC ==="

          find extracted -type f -name "*.rpyc" | wc -l

          echo ""
          echo "=== RPA ==="

          find extracted -type f -name "*.rpa" | wc -l

          echo ""
          echo "=== SCRIPT VERSION ==="

          find extracted -type f -name "x-script_version.txt" -print

          echo ""
          echo "=== BUILD INFO ==="

          find extracted -type f -name "x-build_info.json" -print

      - name: Создать отчёт
        run: |
          mkdir -p result

          echo "MY BEST DEAL 4.7" > result/report.txt
          echo "================" >> result/report.txt
          echo "" >> result/report.txt

          echo "=== x-game ===" >> result/report.txt
          find extracted -type d -name "x-game" -print >> result/report.txt

          echo "" >> result/report.txt
          echo "=== RPYC COUNT ===" >> result/report.txt
          find extracted -type f -name "*.rpyc" | wc -l >> result/report.txt

          echo "" >> result/report.txt
          echo "=== RPA COUNT ===" >> result/report.txt
          find extracted -type f -name "*.rpa" | wc -l >> result/report.txt

          echo "" >> result/report.txt
          echo "=== SCRIPT VERSION ===" >> result/report.txt
          find extracted -type f -name "x-script_version.txt" -exec cat {} \; >> result/report.txt

          echo "" >> result/report.txt
          echo "=== BUILD INFO ===" >> result/report.txt
          find extracted -type f -name "x-build_info.json" -exec cat {} \; >> result/report.txt

          echo ""
          cat result/report.txt

      - name: Загрузить отчёт
        uses: actions/upload-artifact@v4
        with:
          name: mybestdeal-analysis
          path: result/report.txt