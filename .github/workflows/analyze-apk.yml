name: Analyze My Best Deal APK

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        shell: bash
        run: |
          set -e

          echo "=== КОРЕНЬ РЕПОЗИТОРИЯ ==="
          find . -maxdepth 3 -type d | sort | head -200

          echo ""
          echo "=== ПОИСК APK ==="
          find . -type f -iname "*.apk" -print

      - name: Find game assets
        shell: bash
        run: |
          set -e

          echo "=== ПОИСК x-game ==="

          GAME_DIR=$(find . -type d -name "x-game" | head -1 || true)

          if [ -z "$GAME_DIR" ]; then
            echo "ОШИБКА: x-game не найден"
            exit 1
          fi

          echo "НАЙДЕНО: $GAME_DIR"

          echo ""
          echo "=== СОДЕРЖИМОЕ x-game ==="
          find "$GAME_DIR" -maxdepth 3 -type f | sort | head -300

          echo ""
          echo "=== RPYC ФАЙЛЫ ==="
          find "$GAME_DIR" -type f -name "*.rpyc" | sort

          echo ""
          echo "=== RPA ФАЙЛЫ ==="
          find "$GAME_DIR" -type f -name "*.rpa" | sort

          echo ""
          echo "=== ВЕРСИЯ ИГРЫ ==="

          VERSION_FILE=$(find "$GAME_DIR" -type f -name "x-script_version.txt" | head -1 || true)

          if [ -n "$VERSION_FILE" ]; then
            cat "$VERSION_FILE"
          else
            echo "Файл версии не найден"
          fi

          echo ""
          echo "=== BUILD INFO ==="

          BUILD_FILE=$(find "$GAME_DIR" -type f -name "x-build_info.json" | head -1 || true)

          if [ -n "$BUILD_FILE" ]; then
            cat "$BUILD_FILE"
          else
            echo "x-build_info.json не найден"
          fi

      - name: Check RenPy libraries
        shell: bash
        run: |
          echo "=== RENPY LIBRARIES ==="

          find . -type f -name "librenpython.so" -print

          echo ""
          echo "=== DEX FILES ==="

          find . -type f -name "*.dex" -print