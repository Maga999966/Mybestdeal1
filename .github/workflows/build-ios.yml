name: My Best Deal 4.7 - iOS
on:
  workflow_dispatch:
jobs:
  build-ios:
    name: Build iOS Xcode Project
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download Ren'Py 8.0.1
        run: |
          curl -L \
            "https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.zip" \
            -o renpy-sdk.zip
          unzip -q renpy-sdk.zip
          SDK=$(find . -maxdepth 1 -type d -name "renpy-8.0.1*" | head -1)
          if [ -z "$SDK" ]; then
            echo "ERROR: Ren'Py SDK not found"
            exit 1
          fi
          echo "RENpy SDK: $SDK"
          echo "RENpySDK=$SDK" >> "$GITHUB_ENV"
      - name: Download Renios 8.0.1
        run: |
          curl -L \
            "https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip" \
            -o renios.zip
          unzip -q renios.zip -d "$RENpySDK"
          echo "Renios installed"
          ls -la "$RENpySDK"
      - name: Locate game
        run: |
          echo "Repository:"
          find . -maxdepth 3 -type f | head -200
          echo ""
          echo "Searching for game directory..."
          if [ -d "./game" ]; then
            echo "FOUND: ./game"
          elif [ -d "./test_project/game" ]; then
            echo "FOUND: ./test_project/game"
          else
            echo "ERROR: game directory not found"
            exit 1
          fi
      - name: Prepare Ren'Py project
        run: |
          mkdir -p build_project
          if [ -d "./game" ]; then
            cp -R game build_project/
          elif [ -d "./test_project/game" ]; then
            cp -R test_project/game build_project/
          fi
          cat > build_project/renpy-project.json <<'EOF'
          {
            "name": "My Best Deal",
            "version": "4.7"
          }
          EOF
          echo "Project prepared:"
          find build_project/game -maxdepth 2 -type f | head -100
      - name: Check Ren'Py
        run: |
          cd build_project
          "$RENpySDK/renpy.sh" \
            "$PWD" \
            lint \
            || true
      - name: Create iOS Xcode Project
        run: |
          cd build_project
          "$RENpySDK/renpy.sh" \
            "$PWD" \
            ios_create
      - name: Show generated files
        run: |
          echo "=== GENERATED IOS PROJECT ==="
          find build_project -maxdepth 4 \
            \( -name "*.xcodeproj" \
            -o -name "*.xcworkspace" \
            -o -name "*.plist" \
            -o -name "*.pbxproj" \) \
            -print
      - name: Package Xcode project
        run: |
          mkdir -p output
          if find build_project -name "*.xcodeproj" | grep -q .; then
            PROJECT=$(find build_project -name "*.xcodeproj" | head -1)
            echo "Xcode project:"
            echo "$PROJECT"
            PROJECT_DIR=$(dirname "$PROJECT")
            PROJECT_NAME=$(basename "$PROJECT_DIR")
            cd "$PROJECT_DIR/.."
            zip -r \
              "$GITHUB_WORKSPACE/output/MyBestDeal_4.7_iOS_Xcode.zip" \
              "$PROJECT_NAME"
          else
            echo "ERROR: Xcode project was not generated"
            exit 1
          fi
      - name: Upload iOS Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS-Xcode
          path: output/MyBestDeal_4.7_iOS_Xcode.zip
          if-no-files-found: error