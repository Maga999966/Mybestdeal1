name: Build iOS - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Проверить Ren'Py 8.0.1
        run: |
          set -e

          SDK="$GITHUB_WORKSPACE/renpy-8.0.1-sdk"

          if [ ! -f "$SDK/renpy.py" ]; then
            echo "ОШИБКА: Ren'Py SDK не найден"
            exit 1
          fi

          if [ ! -d "$SDK/renios" ]; then
            echo "ОШИБКА: Renios не найден"
            exit 1
          fi

          echo "Ren'Py SDK найден"
          echo "Renios найден"

      - name: Найти x-game
        run: |
          set -e

          GAME_SOURCE=$(find . \
            -type d \
            -name "x-game" \
            -not -path "./renpy-8.0.1-sdk/*" \
            | head -1)

          if [ -z "$GAME_SOURCE" ]; then
            echo "ОШИБКА: x-game не найден"
            exit 1
          fi

          echo "Найдена игра:"
          echo "$GAME_SOURCE"

          rm -rf game
          mkdir -p game

          cp -R "$GAME_SOURCE"/. game/

          echo "=== GAME ==="
          find game -maxdepth 2 -type f | sort | head -200

      - name: Проверить игру
        run: |
          set -e

          COUNT=$(find game -type f -name "*.rpyc" | wc -l | tr -d ' ')

          echo "RPYC файлов: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ОШИБКА: .rpyc файлы не найдены"
            exit 1
          fi

          echo "Версия:"
          cat game/x-script_version.txt || true

          echo ""
          echo "Build info:"
          cat game/x-cache/x-build_info.json || true

      - name: Создать Xcode проект Ren'Py
        run: |
          set -e

          SDK="$GITHUB_WORKSPACE/renpy-8.0.1-sdk"

          cd "$GITHUB_WORKSPACE"

          echo "=== IOS CREATE ==="

          python3 "$SDK/renpy.py" ios_create

      - name: Заполнить Xcode проект
        run: |
          set -e

          SDK="$GITHUB_WORKSPACE/renpy-8.0.1-sdk"

          cd "$GITHUB_WORKSPACE"

          echo "=== IOS POPULATE ==="

          python3 "$SDK/renpy.py" ios_populate

      - name: Найти Xcode проект
        run: |
          echo "=== XCODE PROJECTS ==="

          find . \
            -type d \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -not -path "./renpy-8.0.1-sdk/*" \
            -print

      - name: Сохранить Xcode проект
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS-Xcode
          path: |
            **/*.xcodeproj
            **/*.xcworkspace
            **/ios
          if-no-files-found: warn