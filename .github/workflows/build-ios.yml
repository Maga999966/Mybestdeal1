name: Build iOS - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Скачать RenPy 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "=== СКАЧИВАЕМ RENPY 8.0.1 ==="

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf renpy-sdk
          mkdir -p renpy-sdk

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C renpy-sdk

          if [ ! -f "$RUNNER_TEMP/renpy-sdk/renpy.py" ]; then
            echo "ОШИБКА: RenPy SDK не найден"
            exit 1
          fi

          echo "RenPy SDK успешно установлен"

      - name: Скачать Renios
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "=== СКАЧИВАЕМ RENIOS ==="

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip \
            -d renpy-sdk

          if [ ! -d "$RUNNER_TEMP/renpy-sdk/renios" ]; then
            echo "ОШИБКА: Renios не найден"
            exit 1
          fi

          echo "Renios успешно установлен"

      - name: Скачать APK из Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== RELEASE mybestdeal47 ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo "APK найден:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Распаковать APK
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"
          mkdir -p "$RUNNER_TEMP/apk-extracted"

          echo "=== РАСПАКОВКА APK ==="

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "APK успешно распакован"

      - name: Найти x-game
        run: |
          set -e

          echo "=== ПОИСК x-game ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ОШИБКА: x-game не найден"
            echo ""
            echo "Доступные каталоги:"
            find "$RUNNER_TEMP/apk-extracted" \
              -maxdepth 4 \
              -type d \
              | sort
            exit 1
          fi

          echo "x-game найден:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== ИГРА СКОПИРОВАНА ==="

          find "$GITHUB_WORKSPACE/game" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      - name: Проверить игру
        run: |
          set -e

          echo "=== ПРОВЕРКА ИГРЫ ==="

          RPYC=$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l \
            | tr -d ' ')

          echo "RPYC файлов: $RPYC"

          if [ "$RPYC" -eq 0 ]; then
            echo "ОШИБКА: RPYC файлы не найдены"
            exit 1
          fi

          if [ -f "$GITHUB_WORKSPACE/game/x-script_version.txt" ]; then
            echo ""
            echo "=== ВЕРСИЯ ==="
            cat "$GITHUB_WORKSPACE/game/x-script_version.txt"
          fi

          if [ -f "$GITHUB_WORKSPACE/game/x-cache/x-build_info.json" ]; then
            echo ""
            echo "=== BUILD INFO ==="
            cat "$GITHUB_WORKSPACE/game/x-cache/x-build_info.json"
          fi

      - name: Создать iOS проект
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"
          mkdir -p "$RUNNER_TEMP/ios-project"

          echo "=== IOS CREATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          python3 renpy.py launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Заполнить iOS проект
        run: |
          set -e

          echo "=== IOS POPULATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          python3 renpy.py launcher ios_populate \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Проверить iOS проект
        run: |
          set -e

          echo "=== ПОИСК XCODE ПРОЕКТА ==="

          find "$RUNNER_TEMP/ios-project" \
            -maxdepth 6 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

          echo ""
          echo "=== СОДЕРЖИМОЕ IOS PROJECT ==="

          find "$RUNNER_TEMP/ios-project" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      - name: Загрузить iOS проект
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error