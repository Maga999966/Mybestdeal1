name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download iOS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/zip"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "MyBestDeal-4.7-IOS.3.zip" \
            --dir "$RUNNER_TEMP/zip"

      - name: Extract ZIP
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ios-project"

          unzip -q -o \
            "$RUNNER_TEMP/zip/MyBestDeal-4.7-IOS.3.zip" \
            -d "$RUNNER_TEMP/ios-project"

          echo "=== IOS PROJECT ==="
          find "$RUNNER_TEMP/ios-project" -maxdepth 3 -print

      - name: Build IPA
        run: |
          set -e

          PROJECT="$RUNNER_TEMP/ios-project/ios-project/RenPyTutorialGame.xcodeproj"
          BUILD="$RUNNER_TEMP/build"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: RenPyTutorialGame.xcodeproj NOT FOUND"
            exit 1
          fi

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: SCHEME NOT FOUND"
            exit 1
          fi

          echo "PROJECT: $PROJECT"
          echo "SCHEME: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP=$(find "$BUILD/Build/Products" \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            MyBestDeal-4.7.ipa

          echo "=== IPA CREATED ==="
          ls -lh MyBestDeal-4.7.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-IPA
          path: ${{ runner.temp }}/MyBestDeal-4.7.ipa
          if-no-files-found: error