name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download iOS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ios"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "MyBestDeal-4.7-IOS.3.zip" \
            --dir "$RUNNER_TEMP/ios"

          unzip -q -o \
            "$RUNNER_TEMP/ios/MyBestDeal-4.7-IOS.3.zip" \
            -d "$RUNNER_TEMP/ios/project"

      - name: Find Xcode project
        run: |
          set -e

          PROJECT=$(find "$RUNNER_TEMP/ios/project" \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"
            echo "ZIP CONTENT:"
            find "$RUNNER_TEMP/ios/project" -maxdepth 4 -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "XCODE PROJECT: $PROJECT"

      - name: Find scheme
        run: |
          set -e

          INFO=$(xcodebuild -project "$PROJECT" -list)

          echo "$INFO"

          SCHEME=$(echo "$INFO" | awk '
            /Schemes:/ { found=1; next }
            found && NF {
              gsub(/^[ \t]+|[ \t]+$/, "")
              print
              exit
            }
          ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: SCHEME NOT FOUND"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "SCHEME: $SCHEME"

      - name: Build
        run: |
          set -e

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          set -e

          APP=$(find "$RUNNER_TEMP/build/Build/Products" \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            MyBestDeal-4.7.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-IPA
          path: ${{ runner.temp }}/MyBestDeal-4.7.ipa