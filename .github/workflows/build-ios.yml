name: My Best Deal 4.7 - Get Build Info

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать игру
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Распаковать
        run: |
          mkdir -p game
          unzip -oq game.zip -d game

      - name: Получить информацию о сборке
        run: |
          mkdir -p result

          echo "=== SCRIPT VERSION ===" | tee result/report.txt

          find game -type f -name "x-script_version.txt" -print \
            | tee -a result/report.txt

          echo "" | tee -a result/report.txt

          for FILE in $(find game -type f -name "x-script_version.txt"); do
            echo "FILE: $FILE" | tee -a result/report.txt
            cat "$FILE" | tee -a result/report.txt
            echo "" | tee -a result/report.txt
          done

          echo "=== BUILD INFO ===" | tee -a result/report.txt

          find game -type f -name "x-build_info.json" -print \
            | tee -a result/report.txt

          echo "" | tee -a result/report.txt

          for FILE in $(find game -type f -name "x-build_info.json"); do
            echo "FILE: $FILE" | tee -a result/report.txt
            cat "$FILE" | tee -a result/report.txt
            echo "" | tee -a result/report.txt
          done

          echo "=== RENPY COMMON ===" | tee -a result/report.txt

          find game -type f -path "*x-renpy*x-common*" \
            | head -30 \
            | tee -a result/report.txt

          echo "" | tee -a result/report.txt

          echo "=== RESULT ==="
          cat result/report.txt

      - name: Загрузить результат
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-Build-Info
          path: result/report.txt