name: My Best Deal 4.7 - Detect RenPy

on:
  workflow_dispatch:

jobs:
  detect:
    runs-on: macos-14

    steps:
      - name: Скачать игру
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Распаковать
        run: |
          mkdir -p game
          unzip -oq game.zip -d game

      - name: Скачать RenPy SDK
        run: |
          curl -L --fail \
            https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.zip \
            -o renpy.zip

          unzip -q renpy.zip

      - name: Проверить SDK
        run: |
          find . -maxdepth 2 -type d -name "renpy-*" -print

      - name: Проверить совместимость
        run: |
          SDK=$(find . -maxdepth 1 -type d -name "renpy-*" | head -1)

          echo "SDK: $SDK"
          echo ""

          echo "=== Версия SDK ==="
          "$SDK/renpy.sh" --version || true

          echo ""
          echo "=== Проверка игры ==="

          "$SDK/renpy.sh" \
            launcher \
            distribute \
            "$(pwd)/game" \
            --package mac \
            --destination "$(pwd)/test-build" || true

      - name: Создать отчёт
        if: always()
        run: |
          mkdir -p result

          {
            echo "MY BEST DEAL 4.7"
            echo "================"
            echo ""
            echo "SDK:"
            find . -maxdepth 1 -type d -name "renpy-*" -print
            echo ""
            echo "Размер игры:"
            du -sh game
            echo ""
            echo "RPYC:"
            find game -type f -name "*.rpyc" | wc -l
            echo ""
            echo "RPA:"
            find game -type f -name "*.rpa" | wc -l
            echo ""
            echo "Android runtime:"
            find game -type f -name "librenpython.so"
          } > result/report.txt

          cat result/report.txt

      - name: Загрузить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RenPy-detection
          path: result/