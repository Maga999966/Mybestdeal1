name: My Best Deal 4.7 - Android Runtime Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать игру
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Распаковать
        run: |
          mkdir -p android_game
          unzip -oq game.zip -d android_game

      - name: Установить инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y file binutils strings

      - name: Анализ Android runtime
        run: |
          mkdir -p result

          {
            echo "MY BEST DEAL 4.7"
            echo "================"
            echo ""
            echo "=== SIZE ==="
            du -sh android_game
            echo ""

            echo "=== ALL RENPY LIBRARIES ==="
            find android_game -type f -name "librenpython.so" -print
            echo ""

            for LIB in $(find android_game -type f -name "librenpython.so"); do
              echo "========================================"
              echo "LIBRARY: $LIB"
              echo "========================================"

              echo ""
              echo "--- FILE ---"
              file "$LIB"

              echo ""
              echo "--- STRINGS: RENPY ---"
              strings "$LIB" | grep -iE "renpy|python|version|build" | head -100 || true

              echo ""
              echo "--- ELF INFO ---"
              readelf -h "$LIB" 2>/dev/null | head -30 || true

              echo ""
            done

            echo "=== CLASSES DEX ==="
            find android_game -type f -name "classes*.dex" -print
            echo ""

            for DEX in $(find android_game -type f -name "classes*.dex"); do
              echo "========================================"
              echo "DEX: $DEX"
              echo "========================================"

              strings "$DEX" | grep -iE \
                "renpy|python|pygame|sdl|version|build" \
                | head -200 || true

              echo ""
            done

            echo "=== ANDROID MANIFEST ==="

            MANIFEST=$(find android_game -type f -name "AndroidManifest.xml" | head -1)

            if [ -n "$MANIFEST" ]; then
              strings "$MANIFEST" | head -200
            fi

            echo ""
            echo "=== RENPY FILES ==="
            find android_game -type f | grep -iE \
              "renpy|version|build|config" \
              | head -200

            echo ""
            echo "=== RPYC COUNT ==="
            find android_game -type f -name "*.rpyc" | wc -l

            echo ""
            echo "=== RPA COUNT ==="
            find android_game -type f -name "*.rpa" | wc -l

          } | tee result/report.txt

      - name: Загрузить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-Android-Runtime-Analysis
          path: result/report.txt