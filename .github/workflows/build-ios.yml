name: My Best Deal 4.7 - RenPy Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14

    steps:
      - name: Скачать игру
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Распаковать
        run: |
          rm -rf game
          mkdir -p game
          unzip -oq game.zip -d game

      - name: Скачать RenPy 8.3.7
        run: |
          curl -L --fail \
            https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.zip \
            -o renpy.zip

          unzip -q renpy.zip

      - name: Найти игровые данные
        run: |
          echo "=== Структура ==="
          find game -maxdepth 3 -type d | head -100

          echo ""
          echo "=== x-game ==="
          find game -type d -name "x-game" -print

          echo ""
          echo "=== x-renpy ==="
          find game -type d -name "x-renpy" -print

      - name: Подготовить RenPy проект
        run: |
          SDK=$(find . -maxdepth 1 -type d -name "renpy-*" | head -1)

          mkdir -p projects

          "$SDK/renpy.sh" \
            "$SDK/launcher" \
            create projects/MyBestDeal || true

      - name: Подготовить game
        run: |
          mkdir -p projects/MyBestDeal/game

          cp -R game/assets/x-game/* projects/MyBestDeal/game/ 2>/dev/null || true
          cp -R game/assets/x-renpy/* projects/MyBestDeal/game/ 2>/dev/null || true

          echo "=== Файлы проекта ==="
          find projects/MyBestDeal/game -type f | head -100

      - name: Проверить проект RenPy
        run: |
          SDK=$(find . -maxdepth 1 -type d -name "renpy-*" | head -1)

          echo "=== Версия ==="
          "$SDK/renpy.sh" --version

          echo ""
          echo "=== Проверка проекта ==="

          cd projects/MyBestDeal

          "$SDK/renpy.sh" \
            . \
            lint \
            || true

      - name: Создать отчёт
        if: always()
        run: |
          mkdir -p result

          {
            echo "MY BEST DEAL 4.7"
            echo "================"
            echo ""
            echo "RenPy SDK:"
            ./renpy-8.3.7-sdk/renpy.sh --version || true
            echo ""
            echo "Количество RPYC:"
            find game -type f -name "*.rpyc" | wc -l
            echo ""
            echo "Игровые данные:"
            du -sh game
            echo ""
            echo "Результат:"
            if [ -d "projects/MyBestDeal/game" ]; then
              echo "RenPy project created"
            else
              echo "RenPy project NOT created"
            fi
          } > result/report.txt

          cat result/report.txt

      - name: Загрузить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-renpy-test
          path: result/