name: My Best Deal 4.7 - iOS Build

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: macos-14

    steps:
      - name: Скачать игру
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Распаковать
        run: |
          mkdir -p game
          unzip -oq game.zip -d game

      - name: Проверить Ren'Py
        run: |
          echo "=== Ren'Py ==="
          find game -type d -iname "*renpy*" -print

          echo "=== Compiled scripts ==="
          find game -type f -name "*.rpyc" | wc -l

          echo "=== Android runtime ==="
          find game -type f -name "librenpython.so" -print

      - name: Создать отчёт
        run: |
          mkdir -p result

          {
            echo "MY BEST DEAL 4.7"
            echo "================"
            echo ""
            echo "Размер:"
            du -sh game
            echo ""
            echo "RPYC:"
            find game -type f -name "*.rpyc"
            echo ""
            echo "Android runtime:"
            find game -type f -name "librenpython.so"
            echo ""
            echo "Android files:"
            find game -type f \( \
              -name "AndroidManifest.xml" \
              -o -name "classes.dex" \
            \)
          } > result/analysis.txt

      - name: Сохранить данные игры
        run: |
          mkdir -p result/game_data

          cp -R game/assets result/game_data/ 2>/dev/null || true

          echo "Игровые данные подготовлены."
          du -sh result/game_data || true

      - name: Загрузить результат
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-iOS-prepared
          path: result/