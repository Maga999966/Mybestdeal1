name: Build IPA from Release

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download iOS ZIP from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          DOWNLOAD_DIR="$RUNNER_TEMP/ios-download"

          rm -rf "$DOWNLOAD_DIR"
          mkdir -p "$DOWNLOAD_DIR"

          echo "=== RELEASE ZIP FILES ==="

          gh release view mybestdeal47 \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' |
            grep -i '\.zip$' || true

          ZIP_NAME=$(gh release view mybestdeal47 \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' |
            grep -i '\.zip$' |
            head -1)

          if [ -z "$ZIP_NAME" ]; then
            echo "ERROR: NO ZIP FOUND IN RELEASE"
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_NAME"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "$ZIP_NAME" \
            --dir "$DOWNLOAD_DIR"

          ZIP=$(find "$DOWNLOAD_DIR" \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP DOWNLOAD FAILED"
            exit 1
          fi

          echo "IOS_ZIP=$ZIP" >> "$GITHUB_ENV"

          echo "=== ZIP DOWNLOADED ==="
          ls -lh "$ZIP"

      - name: Extract iOS ZIP
        shell: bash
        run: |
          set -e

          IOS_DIR="$RUNNER_TEMP/ios-project"

          rm -rf "$IOS_DIR"
          mkdir -p "$IOS_DIR"

          echo "=== EXTRACT IOS ZIP ==="

          unzip -q -o "$IOS_ZIP" \
            -d "$IOS_DIR"

          echo "=== ZIP EXTRACTED ==="

      - name: Find Xcode project
        shell: bash
        run: |
          set -e

          echo "=== SEARCH XCODE PROJECT ==="

          XCODEPROJ=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            -print \
            | head -1)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: NO XCODE PROJECT FOUND"

            echo
            echo "PROJECT.PBXPROJ FILES:"

            find "$RUNNER_TEMP/ios-project" \
              -type f \
              -name "project.pbxproj" \
              -print \
              | head -20

            echo
            echo "XCODE WORKSPACES:"

            find "$RUNNER_TEMP/ios-project" \
              -type d \
              -name "*.xcworkspace" \
              -print \
              | head -20

            echo
            echo "DIRECTORIES NEAR ROOT:"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 3 \
              -type d \
              -print \
              | head -100

            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

          echo
          echo "=== XCODE PROJECT FOUND ==="
          echo "$XCODEPROJ"

      - name: Show Xcode information
        shell: bash
        run: |
          set -e

          echo "=== XCODE VERSION ==="

          xcodebuild -version

          echo
          echo "=== PROJECT INFORMATION ==="

          xcodebuild \
            -project "$XCODEPROJ" \
            -list

      - name: Find Xcode scheme
        shell: bash
        run: |
          set -e

          echo "=== FIND SCHEME ==="

          PROJECT_INFO=$(xcodebuild \
            -project "$XCODEPROJ" \
            -list)

          echo "$PROJECT_INFO"

          SCHEME=$(echo "$PROJECT_INFO" |
            awk '
              /Schemes:/ {
                found=1
                next
              }

              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: NO SCHEME FOUND"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo
          echo "=== SCHEME FOUND ==="
          echo "$SCHEME"

      - name: Build iOS application
        shell: bash
        run: |
          set -o pipefail

          echo "=== BUILD IOS APPLICATION ==="

          BUILD_DIR="$RUNNER_TEMP/build"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          echo
          echo "=== BUILD FINISHED ==="

      - name: Find built application
        shell: bash
        run: |
          set -e

          echo "=== FIND BUILT APP ==="

          APP=$(find "$RUNNER_TEMP/build" \
            -type d \
            -name "*.app" \
            -print \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"

            find "$RUNNER_TEMP/build" \
              -maxdepth 8 \
              -print

            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo
          echo "=== APP FOUND ==="
          echo "$APP"

      - name: Create IPA
        shell: bash
        run: |
          set -e

          echo "=== CREATE IPA ==="

          PAYLOAD="$RUNNER_TEMP/Payload"
          IPA="$RUNNER_TEMP/MyBestDeal-4.7-unsigned.ipa"

          rm -rf "$PAYLOAD"
          rm -f "$IPA"

          mkdir -p "$PAYLOAD"

          cp -R "$APP" "$PAYLOAD/"

          cd "$RUNNER_TEMP"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA NOT CREATED"
            exit 1
          fi

          echo
          echo "=== IPA CREATED ==="

          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-IPA
          path: ${{ runner.temp }}/MyBestDeal-4.7-unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-Xcode-Project
          path: ${{ runner.temp }}/ios-project
          if-no-files-found: ignore

      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-Build
          path: ${{ runner.temp }}/build
          if-no-files-found: ignore