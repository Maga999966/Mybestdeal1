name: Build iOS - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Скачать RenPy 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renpy.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          mkdir renpy

          tar -xjf renpy.tar.bz2 \
            --strip-components=1 \
            -C renpy

          echo "=== RENPY ==="
          ls -la renpy

          test -f renpy/renpy.py

      - name: Скачать Renios
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q renios.zip \
            -d renpy

          echo "=== RENIOS ==="
          find renpy/renios -maxdepth 2 -type f | head -50

          test -d renpy/renios

      - name: Скачать APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== RELEASE mybestdeal47 ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo "APK найден:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Распаковать APK
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/apk-extracted"

          unzip -q "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "APK распакован"

      - name: Найти x-game
        run: |
          set -e

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ОШИБКА: x-game не найден"
            exit 1
          fi

          echo "=== x-game ==="
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME ==="
          find game -maxdepth 2 -type f | sort | head -200

      - name: Проверить игру
        run: |
          set -e

          RPYC=$(find game \
            -type f \
            -name "*.rpyc" \
            | wc -l \
            | tr -d ' ')

          echo "RPYC файлов: $RPYC"

          if [ "$RPYC" -eq 0 ]; then
            echo "ОШИБКА: RPYC не найдены"
            exit 1
          fi

          echo ""
          echo "=== VERSION ==="

          cat game/x-script_version.txt || true

          echo ""
          echo "=== BUILD INFO ==="

          cat game/x-cache/x-build_info.json || true

      - name: Создать iOS проект RenPy
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"

          mkdir -p "$RUNNER_TEMP/ios-project"

          cd "$RUNNER_TEMP/renpy"

          echo "=== IOS CREATE ==="

          python3 renpy.py launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Заполнить iOS проект
        run: |
          set -e

          cd "$RUNNER_TEMP/renpy"

          echo "=== IOS POPULATE ==="

          python3 renpy.py launcher ios_populate \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Проверить результат
        run: |
          set -e

          echo "=== IOS PROJECT ==="

          find "$RUNNER_TEMP/ios-project" \
            -maxdepth 5 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Загрузить Xcode проект
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project
          if-no-files-found: error