name: My Best Deal 4.7 - iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Загрузить проект
        uses: actions/checkout@v4

      - name: Скачать полный архив игры
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Проверить архив
        run: |
          ls -lh game.zip
          file game.zip

      - name: Распаковать игру
        run: |
          mkdir -p game
          unzip -q game.zip -d game

      - name: Найти Ren'Py
        run: |
          echo "=== Ren'Py ==="
          find game -type d -iname "*renpy*" | head -50

          echo "=== Game ==="
          find game -type d -iname "*game*" | head -50

          echo "=== Python ==="
          find game -type f \( -name "*.py" -o -name "*.pyc" \) | head -50

          echo "=== RPY ==="
          find game -type f -name "*.rpy" | head -50

          echo "=== RPYC ==="
          find game -type f -name "*.rpyc" | head -50

      - name: Проверить Android-специфичные файлы
        run: |
          echo "=== Android ==="
          find game -type f \( \
            -name "*.dex" \
            -o -name "*.so" \
            -o -name "AndroidManifest.xml" \
            -o -name "*android*" \
          \) | head -200

      - name: Создать отчёт
        if: always()
        run: |
          mkdir -p result
          find game -type f > result/files.txt
          du -sh game > result/size.txt

      - name: Загрузить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-iOS-analysis
          path: result/