name: Build IPA from iOS ZIP

on:
 workflow_dispatch:

jobs:
 build-ipa:
  runs-on: macos-14

  steps:
  - name: Checkout
    uses: actions/checkout@v4
  - name: Find iOS ZIP
    shell: bash
    run: |
      set -e
      echo "=== FIND IOS ZIP ==="
      ZIP=$(find "$GITHUB_WORKSPACE" \
        -maxdepth 2 \
        -type f \
        -iname "*.zip" \
        -print -quit)
      if [ -z "$ZIP" ]; then
        echo "ERROR: IOS ZIP NOT FOUND"
        exit 1
      fi
      echo "IOS_ZIP=$ZIP" >> "$GITHUB_ENV"
      echo "FOUND:"
      echo "$ZIP"
  - name: Extract iOS project
    shell: bash
    run: |
      set -e
      IOS_DIR="$RUNNER_TEMP/ios-project"
      rm -rf "$IOS_DIR"
      mkdir -p "$IOS_DIR"
      echo "=== EXTRACT IOS ZIP ==="
      unzip -q -o "$IOS_ZIP" \
        -d "$IOS_DIR"
      echo "=== EXTRACTED ==="
      find "$IOS_DIR" \
        -maxdepth 5 \
        -print
  - name: Find Xcode project
    shell: bash
    run: |
      set -e
      echo "=== FIND XCODE PROJECT ==="
      XCODEPROJ=$(find "$RUNNER_TEMP/ios-project" \
        -type d \
        -name "*.xcodeproj" \
        -print -quit)
      if [ -z "$XCODEPROJ" ]; then
        echo "ERROR: .xcodeproj NOT FOUND"
        find "$RUNNER_TEMP/ios-project" \
          -maxdepth 7 \
          -print
        exit 1
      fi
      echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
      echo "XCODE PROJECT FOUND:"
      echo "$XCODEPROJ"
  - name: Show Xcode information
    shell: bash
    run: |
      set -e
      echo "=== XCODE VERSION ==="
      xcodebuild -version
      echo
      echo "=== PROJECT INFORMATION ==="
      xcodebuild \
        -project "$XCODEPROJ" \
        -list
  - name: Find Xcode scheme
    shell: bash
    run: |
      set -e
      echo "=== FIND SCHEME ==="
      PROJECT_INFO=$(xcodebuild \
        -project "$XCODEPROJ" \
        -list)
      echo "$PROJECT_INFO"
      SCHEME=$(echo "$PROJECT_INFO" |
        awk '
          /Schemes:/ {
            found=1
            next
          }
          found && NF {
            gsub(/^[ \t]+|[ \t]+$/, "")
            print
            exit
          }
        ')
      if [ -z "$SCHEME" ]; then
        echo "ERROR: SCHEME NOT FOUND"
        exit 1
      fi
      echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
      echo "=== SCHEME FOUND ==="
      echo "$SCHEME"
  - name: Build iOS application
    shell: bash
    run: |
      set -o pipefail
      echo "=== BUILD IOS APP ==="
      BUILD_DIR="$RUNNER_TEMP/build"
      rm -rf "$BUILD_DIR"
      mkdir -p "$BUILD_DIR"
      xcodebuild \
        -project "$XCODEPROJ" \
        -scheme "$SCHEME" \
        -configuration Release \
        -sdk iphoneos \
        -derivedDataPath "$BUILD_DIR" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        build
  - name: Find built application
    shell: bash
    run: |
      set -e
      echo "=== FIND APP ==="
      APP=$(find "$RUNNER_TEMP/build/Build/Products" \
        -type d \
        -name "*.app" \
        -print -quit)
      if [ -z "$APP" ]; then
        echo "ERROR: APP NOT FOUND"
        find "$RUNNER_TEMP/build" \
          -maxdepth 8 \
          -print
        exit 1
      fi
      echo "APP=$APP" >> "$GITHUB_ENV"
      echo "APP FOUND:"
      echo "$APP"
  - name: Create unsigned IPA
    shell: bash
    run: |
      set -e
      echo "=== CREATE UNSIGNED IPA ==="
      PAYLOAD="$RUNNER_TEMP/Payload"
      IPA="$RUNNER_TEMP/MyBestDeal-4.7-unsigned.ipa"
      rm -rf "$PAYLOAD"
      rm -f "$IPA"
      mkdir -p "$PAYLOAD"
      cp -R "$APP" \
        "$PAYLOAD/"
      cd "$RUNNER_TEMP"
      ditto -c -k \
        --sequesterRsrc \
        --keepParent \
        Payload \
        "$IPA"
      if [ ! -f "$IPA" ]; then
        echo "ERROR: IPA NOT CREATED"
        exit 1
      fi
      echo "=== IPA CREATED ==="
      ls -lh "$IPA"
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: MyBestDeal-4.7-unsigned-IPA
      path: ${{ runner.temp }}/MyBestDeal-4.7-unsigned.ipa
      if-no-files-found: error
  - name: Upload Xcode project
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: MyBestDeal-4.7-iOS-Project
      path: ${{ runner.temp }}/ios-project
      if-no-files-found: ignore