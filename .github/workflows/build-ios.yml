name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download iOS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/ios"

          echo "=== RELEASE FILES ==="

          gh release view mybestdeal47 \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name'

          echo
          echo "=== FIND ZIP ==="

          ZIP=$(gh release view mybestdeal47 \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' |
            grep -i '\.zip$' |
            head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: NO ZIP FOUND IN RELEASE"
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "$ZIP" \
            --dir "$RUNNER_TEMP/ios"

          FILE=$(find "$RUNNER_TEMP/ios" \
            -type f \
            -name "*.zip" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: ZIP DOWNLOAD FAILED"
            exit 1
          fi

          echo "IOS_ZIP=$FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/project"

          unzip -q -o \
            "$IOS_ZIP" \
            -d "$RUNNER_TEMP/project"

          echo "=== ZIP CONTENT ==="

          find "$RUNNER_TEMP/project" \
            -maxdepth 4 \
            -print

      - name: Find Xcode project
        run: |
          set -e

          PROJECT=$(find "$RUNNER_TEMP/project" \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"
            echo
            echo "Searching project.pbxproj..."

            find "$RUNNER_TEMP/project" \
              -name "project.pbxproj" \
              -print

            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "XCODE PROJECT:"
          echo "$PROJECT"

      - name: Find scheme
        run: |
          set -e

          INFO=$(xcodebuild \
            -project "$PROJECT" \
            -list)

          echo "$INFO"

          SCHEME=$(echo "$INFO" | awk '
            /Schemes:/ {
              found=1
              next
            }
            found && NF {
              gsub(/^[ \t]+|[ \t]+$/, "")
              print
              exit
            }
          ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: SCHEME NOT FOUND"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "SCHEME: $SCHEME"

      - name: Build
        run: |
          set -e

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          set -e

          APP=$(find "$RUNNER_TEMP/build/Build/Products" \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"

          mkdir "$RUNNER_TEMP/Payload"

          cp -R "$APP" \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            MyBestDeal-4.7.ipa

          echo "=== IPA CREATED ==="

          ls -lh MyBestDeal-4.7.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-IPA
          path: ${{ runner.temp }}/MyBestDeal-4.7.ipa
          if-no-files-found: error