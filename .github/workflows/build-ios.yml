name: Build iOS - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build My Best Deal 4.7 for iOS
    runs-on: macos-13

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          set -e

          echo "=== REPOSITORY ==="
          find . -maxdepth 3 -type d | sort

      - name: Check Ren'Py SDK
        run: |
          set -e

          SDK="./renpy-8.0.1-sdk"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Ren'Py SDK not found:"
            echo "$SDK"
            exit 1
          fi

          echo "Ren'Py SDK found:"
          "$SDK/renpy.py" --version || true

      - name: Prepare game directory
        run: |
          set -e

          echo "=== SEARCH x-game ==="

          GAME_SOURCE=$(find . -type d -name "x-game" \
            -not -path "./renpy-8.0.1-sdk/*" | head -1 || true)

          if [ -z "$GAME_SOURCE" ]; then
            echo "ERROR: x-game not found"
            exit 1
          fi

          echo "Found:"
          echo "$GAME_SOURCE"

          rm -rf game
          mkdir -p game

          cp -R "$GAME_SOURCE"/. game/

          echo ""
          echo "=== GAME DIRECTORY ==="
          find game -maxdepth 3 -type f | sort | head -300

      - name: Verify game files
        run: |
          set -e

          echo "=== GAME CHECK ==="

          RPYC_COUNT=$(find game -type f -name "*.rpyc" | wc -l | tr -d ' ')

          echo "RPYC files: $RPYC_COUNT"

          if [ "$RPYC_COUNT" -eq 0 ]; then
            echo "ERROR: No RPYC files found"
            exit 1
          fi

          echo ""
          echo "Script version:"

          if [ -f "game/x-script_version.txt" ]; then
            cat game/x-script_version.txt
          fi

          echo ""
          echo "Build info:"

          if [ -f "game/x-cache/x-build_info.json" ]; then
            cat game/x-cache/x-build_info.json
          fi

      - name: Prepare Ren'Py project
        run: |
          set -e

          cat > project.json <<'EOF'
          {
            "renpy_version": "8.0.1",
            "version": "4.7",
            "name": "My Best Deal 4.7",
            "package": "mybestdeal47"
          }
          EOF

          echo "=== PROJECT ==="
          cat project.json

      - name: Check Ren'Py launcher
        run: |
          set -e

          SDK="./renpy-8.0.1-sdk"

          if [ ! -f "$SDK/renpy.py" ]; then
            echo "ERROR: renpy.py not found"
            exit 1
          fi

          echo "Ren'Py files:"
          ls -la "$SDK" | head -50

      - name: Build iOS
        run: |
          set -e

          SDK="./renpy-8.0.1-sdk"

          echo "=== START iOS BUILD ==="

          python3 "$SDK/renpy.py" \
            "$SDK" \
            build \
            --destination "build"

      - name: Show build result
        if: always()
        run: |
          echo "=== BUILD RESULT ==="

          if [ -d "build" ]; then
            find build -maxdepth 4 -type f | sort
          else
            echo "Build directory does not exist."
          fi

      - name: Upload iOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: build/
          if-no-files-found: error
          