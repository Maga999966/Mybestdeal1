name: My Best Deal 4.7 - Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: macos-14

    steps:
      - name: Скачать assets.zip
        run: |
          FILE_ID="1CTwPCfcnFDCJDIK5qua7n7iWIeP99ir6"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          curl -L --fail --retry 5 \
            "$URL" \
            -o assets.zip

      - name: Проверить архив
        run: |
          echo "Размер:"
          ls -lh assets.zip
          echo "Тип:"
          file assets.zip

      - name: Распаковать
        run: |
          mkdir game_data
          unzip -q assets.zip -d game_data

      - name: Проверить содержимое
        run: |
          echo "Размер game_data:"
          du -sh game_data

          echo "Первые файлы:"
          find game_data -type f | head -200

      - name: Сохранить отчёт
        if: always()
        run: |
          mkdir result
          find game_data -type f > result/files.txt 2>/dev/null || true
          du -sh game_data > result/size.txt 2>/dev/null || true

      - name: Загрузить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-report
          path: result/