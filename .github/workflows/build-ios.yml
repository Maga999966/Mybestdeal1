name: My Best Deal 4.7 - Check APK data

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Загрузить репозиторий
        uses: actions/checkout@v4

      - name: Скачать assets.zip
        run: |
          curl -L --fail --retry 3 \
            "https://drive.google.com/uc?export=download&id=1CTwPCfcnFDCJDIK5qua7n7iWIeP99ir6" \
            -o assets.zip

      - name: Проверить размер архива
        run: |
          ls -lh assets.zip
          file assets.zip

      - name: Распаковать архив
        run: |
          mkdir -p game_data
          unzip -q assets.zip -d game_data || true

      - name: Проверить структуру
        run: |
          echo "=== Папки ==="
          find game_data -maxdepth 3 -type d | head -200

          echo "=== Файлы ==="
          find game_data -type f | head -500

      - name: Создать отчёт
        if: always()
        run: |
          mkdir -p result
          find game_data -type f > result/files.txt
          du -sh game_data > result/size.txt

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-report
          path: result/