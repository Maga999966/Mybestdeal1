name: My Best Deal 4.7 - iOS Compatibility

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Скачать игру
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Распаковать
        run: |
          mkdir -p android_game
          unzip -oq game.zip -d android_game

      - name: Скачать Ren'Py SDK
        run: |
          curl -L --fail \
            https://www.renpy.org/dl/8.3.7/renpy-8.3.7-sdk.zip \
            -o renpy.zip

          unzip -q renpy.zip

      - name: Определить SDK
        run: |
          SDK="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'renpy-*-sdk' | head -1)"

          echo "SDK=$SDK" >> "$GITHUB_ENV"

          echo "=== REN'PY ==="
          "$SDK/renpy.sh" --version

      - name: Определить структуру игры
        run: |
          mkdir -p result

          {
            echo "=== GAME SIZE ==="
            du -sh android_game

            echo ""
            echo "=== REN'PY DATA ==="
            find android_game -type d -iname "*renpy*"

            echo ""
            echo "=== RPYC COUNT ==="
            find android_game -type f -name "*.rpyc" | wc -l

            echo ""
            echo "=== RPY COUNT ==="
            find android_game -type f -name "*.rpy" | wc -l

            echo ""
            echo "=== RPA COUNT ==="
            find android_game -type f -name "*.rpa" | wc -l

            echo ""
            echo "=== ANDROID RUNTIME ==="
            find android_game -type f -name "librenpython.so"

            echo ""
            echo "=== ANDROID FILES ==="
            find android_game -type f \( \
              -name "AndroidManifest.xml" \
              -o -name "classes.dex" \
            \)
          } | tee result/report.txt

      - name: Подготовить Ren'Py game directory
        run: |
          rm -rf test_project
          mkdir -p test_project/game

          cp -R android_game/assets/x-game/. test_project/game/ 2>/dev/null || true
          cp -R android_game/assets/x-renpy/. test_project/game/ 2>/dev/null || true

          echo "=== GAME DIRECTORY ==="
          find test_project/game -type f | head -100

      - name: Проверить Ren'Py game directory
        run: |
          cd test_project

          echo "=== REN'PY VERSION ==="
          "$SDK/renpy.sh" --version

          echo ""
          echo "=== GAME FILES ==="
          find game -type f -name "*.rpyc" | wc -l

          echo ""
          echo "=== PYTHON/RPY FILES ==="
          find game -type f \( -name "*.py" -o -name "*.rpy" \) | head -50

          echo ""
          echo "=== TEST ==="

          "$SDK/renpy.sh" . lint

      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-final-check
          path: result/