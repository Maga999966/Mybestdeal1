name: My Best Deal 4.7 - RPYC Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать игру
        run: |
          FILE_ID="1BohaY4hx0TfimVWu7QSqjUo7FkCfEfhl"
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"

          curl -L --fail --retry 5 "$URL" -o game.zip

      - name: Распаковать
        run: |
          mkdir -p android_game
          unzip -oq game.zip -d android_game

      - name: Анализировать RPYC
        run: |
          mkdir -p result

          python3 <<'PY'
          import os
          import struct
          import hashlib

          root = "android_game"
          files = []

          for base, dirs, names in os.walk(root):
              for name in names:
                  if name.endswith(".rpyc"):
                      files.append(os.path.join(base, name))

          files.sort()

          with open("result/rpyc-analysis.txt", "w", encoding="utf-8") as out:
              out.write("MY BEST DEAL 4.7 - RPYC ANALYSIS\n")
              out.write("=" * 50 + "\n\n")

              out.write(f"RPYC files: {len(files)}\n\n")

              for path in files:
                  rel = os.path.relpath(path, root)

                  try:
                      data = open(path, "rb").read(128)

                      sha = hashlib.sha256(
                          open(path, "rb").read()
                      ).hexdigest()

                      out.write(f"FILE: {rel}\n")
                      out.write(f"SIZE: {os.path.getsize(path)}\n")
                      out.write(f"SHA256: {sha}\n")
                      out.write(
                          "HEADER HEX: " +
                          data[:64].hex(" ") +
                          "\n"
                      )

                      printable = "".join(
                          chr(x) if 32 <= x < 127 else "."
                          for x in data
                      )

                      out.write(
                          "HEADER TEXT: " +
                          printable +
                          "\n\n"
                      )

                  except Exception as e:
                      out.write(f"ERROR: {e}\n\n")

          print(open("result/rpyc-analysis.txt").read())
          PY

      - name: Анализ Android runtime
        run: |
          {
            echo ""
            echo "=== ANDROID RUNTIME ==="
            find android_game -type f -name "librenpython.so" -print

            echo ""
            echo "=== ANDROID MANIFEST ==="
            find android_game -type f -name "AndroidManifest.xml" -print

            echo ""
            echo "=== CLASSES DEX ==="
            find android_game -type f -name "classes*.dex" -print

            echo ""
            echo "=== RENPY DIRECTORIES ==="
            find android_game -type d -iname "*renpy*" -print
          } >> result/rpyc-analysis.txt

      - name: Сохранить результат
        uses: actions/upload-artifact@v4
        with:
          name: My-Best-Deal-4.7-RPYC-Analysis
          path: result/