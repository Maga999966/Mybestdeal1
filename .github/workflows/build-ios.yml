name: Build iOS - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Найти Ren'Py SDK
        run: |
          set -e

          echo "=== ПОИСК RENPY.PY ==="

          SDK=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "renpy.py" \
            -not -path "*/.git/*" \
            | head -1)

          if [ -z "$SDK" ]; then
            echo "ОШИБКА: renpy.py не найден"
            echo ""
            echo "=== КАТАЛОГИ РЕПОЗИТОРИЯ ==="
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type d | sort
            exit 1
          fi

          SDK_DIR=$(dirname "$SDK")

          echo "Ren'Py найден:"
          echo "$SDK"

          echo "SDK:"
          echo "$SDK_DIR"

          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Проверить Renios
        run: |
          set -e

          echo "=== ПРОВЕРКА RENIOS ==="

          if [ ! -d "$SDK_DIR/renios" ]; then
            echo "ОШИБКА: папка renios не найдена"
            find "$SDK_DIR" -maxdepth 2 -type d | sort
            exit 1
          fi

          echo "Renios найден."

      - name: Найти x-game
        run: |
          set -e

          echo "=== ПОИСК x-game ==="

          GAME_SOURCE=$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "x-game" \
            -not -path "*/.git/*" \
            -not -path "*/renpy-8.0.1-sdk/*" \
            | head -1)

          if [ -z "$GAME_SOURCE" ]; then
            echo "ОШИБКА: x-game не найден"
            exit 1
          fi

          echo "Игра найдена:"
          echo "$GAME_SOURCE"

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME_SOURCE"/. "$GITHUB_WORKSPACE/game"/

          echo "GAME_DIR=$GITHUB_WORKSPACE/game" >> "$GITHUB_ENV"

      - name: Проверить игру
        run: |
          set -e

          echo "=== ПРОВЕРКА ИГРЫ ==="

          RPYC=$(find "$GAME_DIR" -type f -name "*.rpyc" | wc -l | tr -d ' ')

          echo "RPYC: $RPYC"

          if [ "$RPYC" -eq 0 ]; then
            echo "ОШИБКА: rpyc не найден"
            exit 1
          fi

          echo ""
          echo "Версия:"
          cat "$GAME_DIR/x-script_version.txt" || true

          echo ""
          echo "Build info:"
          cat "$GAME_DIR/x-cache/x-build_info.json" || true

      - name: Создать iOS Xcode проект
        run: |
          set -e

          IOS_PROJECT="$GITHUB_WORKSPACE/ios-project"

          rm -rf "$IOS_PROJECT"
          mkdir -p "$IOS_PROJECT"

          echo "=== IOS CREATE ==="

          cd "$SDK_DIR"

          ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$IOS_PROJECT"

      - name: Обновить iOS проект
        run: |
          set -e

          echo "=== IOS POPULATE ==="

          cd "$SDK_DIR"

          ./renpy.sh launcher ios_populate \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/ios-project"

      - name: Показать результат
        if: always()
        run: |
          echo "=== РЕЗУЛЬТАТ ==="

          find "$GITHUB_WORKSPACE/ios-project" \
            -maxdepth 4 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print || true

      - name: Загрузить iOS проект
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ios-project/
          if-no-files-found: error