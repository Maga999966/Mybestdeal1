name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Download iOS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/zip"

          echo "=== RELEASE ASSETS ==="
          gh release view mybestdeal47 \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name'

          ZIP=$(gh release view mybestdeal47 \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' |
            grep -i '\.zip$' |
            head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: NO ZIP IN RELEASE"
            exit 1
          fi

          echo "=== ZIP FOUND ==="
          echo "$ZIP"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "$ZIP" \
            --dir "$RUNNER_TEMP/zip"

          echo "=== DOWNLOADED ==="
          ls -lh "$RUNNER_TEMP/zip"

      - name: Extract
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/extracted"

          ZIP=$(find "$RUNNER_TEMP/zip" \
            -type f \
            -iname "*.zip" \
            -print -quit)

          unzip -q -o "$ZIP" \
            -d "$RUNNER_TEMP/extracted"

          echo "=== EXTRACTED ==="
          find "$RUNNER_TEMP/extracted" -maxdepth 3 -print

      - name: Build IPA
        run: |
          set -e

          PROJECT=$(find "$RUNNER_TEMP/extracted" \
            -type d \
            -name "RenPyTutorialGame.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: RenPyTutorialGame.xcodeproj NOT FOUND"
            find "$RUNNER_TEMP/extracted" -maxdepth 5 -print
            exit 1
          fi

          echo "=== XCODE PROJECT ==="
          echo "$PROJECT"

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '
              /Schemes:/ {
                found=1
                next
              }
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: SCHEME NOT FOUND"
            exit 1
          fi

          echo "=== SCHEME ==="
          echo "$SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP=$(find "$RUNNER_TEMP/build/Build/Products" \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            MyBestDeal-4.7.ipa

          echo "=== IPA CREATED ==="
          ls -lh MyBestDeal-4.7.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-IPA
          path: ${{ runner.temp }}/MyBestDeal-4.7.ipa
          if-no-files-found: error