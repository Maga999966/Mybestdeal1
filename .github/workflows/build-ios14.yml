name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # RENPY 8.0.1
      # ============================================================

      - name: Download RenPy 8.0.1
        shell: bash
        run: |
          set -e

          echo "=== DOWNLOAD RENPY 8.0.1 ==="

          cd "$RUNNER_TEMP"

          rm -rf renpy-sdk
          rm -f renpy-sdk.tar.bz2

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          mkdir -p renpy-sdk

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C renpy-sdk

          chmod +x renpy-sdk/renpy.sh

          test -f renpy-sdk/renpy.sh

          echo "=== RENPY SDK OK ==="

      # ============================================================
      # RENIOS
      # ============================================================

      - name: Install Renios
        shell: bash
        run: |
          set -e

          echo "=== INSTALL RENIOS ==="

          cd "$RUNNER_TEMP"

          rm -f renios.zip

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip \
            -d renpy-sdk

          test -d renpy-sdk/renios

          echo "=== RENIOS INSTALLED ==="

      # ============================================================
      # CHECK RENPY
      # ============================================================

      - name: Check RenPy
        shell: bash
        run: |
          set -e

          echo "=== CHECK RENPY ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          test -f renpy.sh
          test -d renios
          test -f renpy.py

          echo "RenPy:"
          ./renpy.sh --version || true

          echo "Renios:"
          find renios -maxdepth 3 -type f | head -40

          echo "=== RENPY READY ==="

      # ============================================================
      # DOWNLOAD APK FROM RELEASE
      # ============================================================

      - name: Download APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=== DOWNLOAD APK ==="

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK"

      # ============================================================
      # EXTRACT APK
      # ============================================================

      - name: Extract APK
        shell: bash
        run: |
          set -e

          echo "=== EXTRACT APK ==="

          rm -rf "$RUNNER_TEMP/apk-extracted"

          mkdir -p "$RUNNER_TEMP/apk-extracted"

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "=== APK EXTRACTED ==="

      # ============================================================
      # PREPARE RENPY PROJECT
      # ============================================================

      - name: Prepare RenPy project
        shell: bash
        run: |
          set -e

          echo "=== PREPARE PROJECT ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"
            exit 1
          fi

          echo "x-game:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME COPIED ==="

          echo "RPYC COUNT:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l

          echo "RPA COUNT:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpa" \
            | wc -l

      # ============================================================
      # CREATE BASIC PROJECT FILE
      # ============================================================

      - name: Create project configuration
        shell: bash
        run: |
          set -e

          echo "=== PROJECT CONFIG ==="

          cat > "$GITHUB_WORKSPACE/options.rpy" <<'EOF'
          define config.name = "My Best Deal 4.7"
          define config.version = "4.7"
          EOF

          echo "=== CONFIG CREATED ==="

      # ============================================================
      # CLEAN OLD IOS OUTPUT
      # ============================================================

      - name: Clean iOS output
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"

          mkdir -p "$RUNNER_TEMP/ios-parent"

          rm -rf "$RUNNER_TEMP/ios-parent/MyBestDeal"

          echo "=== IOS OUTPUT CLEAN ==="

      # ============================================================
      # CREATE IOS PROJECT
      # ============================================================

      - name: Create iOS Xcode project
        shell: bash
        run: |
          set -e

          echo "=== IOS CREATE ==="

          SDK="$RUNNER_TEMP/renpy-sdk"
          PROJECT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/ios-project"

          rm -rf "$DEST"

          cd "$SDK"

          echo "SDK:"
          echo "$SDK"

          echo "PROJECT:"
          echo "$PROJECT"

          echo "DEST:"
          echo "$DEST"

          echo "=== RUN IOS_CREATE ==="

          "$SDK/renpy.sh" launcher ios_create \
            "$PROJECT" \
            "$DEST" < <(printf 'yes\n')

          echo "=== IOS CREATE FINISHED ==="

      # ============================================================
      # VERIFY XCODE
      # ============================================================

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          echo "=== VERIFY XCODE PROJECT ==="

          if [ ! -d "$RUNNER_TEMP/ios-project" ]; then
            echo "ERROR: IOS PROJECT DIRECTORY NOT FOUND"
            exit 1
          fi

          XCODE=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "=== XCODE PROJECT FOUND ==="
          echo "$XCODE"

      # ============================================================
      # ARCHIVE
      # ============================================================

      - name: Archive iOS project
        shell: bash
        run: |
          set -e

          echo "=== ARCHIVE ==="

          cd "$RUNNER_TEMP"

          rm -f MyBestDeal-4.7-iOS.zip

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            ios-project \
            MyBestDeal-4.7-iOS.zip

          test -f MyBestDeal-4.7-iOS.zip

          ls -lh MyBestDeal-4.7-iOS.zip

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/MyBestDeal-4.7-iOS.zip
          if-no-files-found: error