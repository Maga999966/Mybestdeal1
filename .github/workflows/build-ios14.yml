name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RenPy 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "=== DOWNLOAD RENPY 8.0.1 ==="

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf "$RUNNER_TEMP/renpy-sdk"

          mkdir -p "$RUNNER_TEMP/renpy-sdk"

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C "$RUNNER_TEMP/renpy-sdk"

          test -f "$RUNNER_TEMP/renpy-sdk/renpy.py"
          test -f "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          chmod +x "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          echo "RenPy SDK OK"

      - name: Install Renios 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "=== DOWNLOAD RENIOS 8.0.1 ==="

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          rm -rf "$RUNNER_TEMP/renpy-sdk/renios"

          unzip -q -o renios.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          echo "=== CHECK RENIOS STRUCTURE ==="

          if [ ! -d "$RUNNER_TEMP/renpy-sdk/renios" ]; then
            echo "ERROR: renios directory not found"
            find "$RUNNER_TEMP/renpy-sdk" -maxdepth 2 -type d | sort
            exit 1
          fi

          if [ ! -d "$RUNNER_TEMP/renpy-sdk/renios/buildlib" ]; then
            echo "ERROR: renios/buildlib not found"
            echo "Actual structure:"
            find "$RUNNER_TEMP/renpy-sdk/renios" -maxdepth 3 -type d | sort
            exit 1
          fi

          if [ ! -f "$RUNNER_TEMP/renpy-sdk/renios/buildlib/renios/interface.py" ]; then
            echo "ERROR: renios.interface not found"
            echo "Actual files:"
            find "$RUNNER_TEMP/renpy-sdk/renios" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "Renios structure OK"

      - name: Verify RenPy iOS support
        run: |
          set -e

          cd "$RUNNER_TEMP/renpy-sdk"

          echo "=== VERIFY RENIOS IMPORT ==="

          ./renpy.sh -c \
            "import sys; sys.path.insert(0, 'renios/buildlib'); import renios.interface; print('renios.interface: OK')"

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== DOWNLOAD APK FROM RELEASE ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Extract APK
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"

          mkdir -p "$RUNNER_TEMP/apk-extracted"

          echo "=== EXTRACT APK ==="

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "APK extracted"

      - name: Find x-game
        run: |
          set -e

          echo "=== FIND x-game ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game not found"

            find "$RUNNER_TEMP/apk-extracted" \
              -maxdepth 5 \
              -type d \
              | sort

            exit 1
          fi

          echo "x-game found:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

      - name: Verify game
        run: |
          set -e

          echo "=== VERIFY GAME ==="

          RPYC=$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l \
            | tr -d ' ')

          echo "RPYC count: $RPYC"

          if [ "$RPYC" -eq 0 ]; then
            echo "ERROR: No RPYC files found"
            exit 1
          fi

          echo ""
          echo "=== SCRIPT VERSION ==="

          cat "$GITHUB_WORKSPACE/game/x-script_version.txt" || true

          echo ""
          echo "=== BUILD INFO ==="

          cat "$GITHUB_WORKSPACE/game/x-cache/x-build_info.json" || true

      - name: Create iOS project
        run: |
          set -e

          echo "=== IOS CREATE ==="

          rm -rf "$RUNNER_TEMP/ios-project"

          mkdir -p "$RUNNER_TEMP/ios-project"

          cd "$RUNNER_TEMP/renpy-sdk"

          ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Populate iOS project
        run: |
          set -e

          echo "=== IOS POPULATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          ./renpy.sh launcher ios_populate \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Verify Xcode project
        run: |
          set -e

          echo "=== XCODE PROJECT ==="

          find "$RUNNER_TEMP/ios-project" \
            -maxdepth 6 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error