name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # DOWNLOAD RENPY 8.0.1
      # ============================================================

      - name: Download RenPy 8.0.1
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          echo "=== DOWNLOAD RENPY 8.0.1 ==="

          rm -rf "$SDK"

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/renpy-sdk.tar.bz2" \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          mkdir -p "$SDK"

          tar -xjf "$RUNNER_TEMP/renpy-sdk.tar.bz2" \
            --strip-components=1 \
            -C "$SDK"

          chmod +x "$SDK/renpy.sh"

          test -f "$SDK/renpy.sh"

          echo "=== RENPY SDK OK ==="


      # ============================================================
      # DOWNLOAD RAPT
      # ============================================================

      - name: Download RAPT
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          echo "=== DOWNLOAD RAPT ==="

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/rapt.zip" \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          unzip -q -o \
            "$RUNNER_TEMP/rapt.zip" \
            -d "$SDK"

          test -d "$SDK/rapt"

          echo "=== RAPT OK ==="


      # ============================================================
      # DOWNLOAD RENIOS
      # ============================================================

      - name: Download RenIOS
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          echo "=== DOWNLOAD RENIOS ==="

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/renios.zip" \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o \
            "$RUNNER_TEMP/renios.zip" \
            -d "$SDK"

          test -d "$SDK/renios"

          echo "=== RENIOS OK ==="


      # ============================================================
      # VERIFY RENPY STRUCTURE
      # ============================================================

      - name: Verify RenPy
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          echo "=== VERIFY RENPY ==="

          test -x "$SDK/renpy.sh"

          test -d "$SDK/rapt"

          test -d "$SDK/renios"

          test -f "$SDK/renios/hash.txt"

          test -d "$SDK/renios/buildlib"

          test -f "$SDK/renios/buildlib/renios/__init__.py"

          test -f "$SDK/renios/buildlib/renios/create.py"

          test -f "$SDK/renios/buildlib/renios/image.py"

          echo "=== RENPY 8.0.1 + RAPT + RENIOS READY ==="


      # ============================================================
      # DOWNLOAD APK
      # ============================================================

      - name: Download APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR="$RUNNER_TEMP/apk"

          rm -rf "$APK_DIR"

          mkdir -p "$APK_DIR"

          echo "=== DOWNLOAD APK ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$APK_DIR"

          APK=$(find "$APK_DIR" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=== APK FOUND ==="
          echo "$APK"


      # ============================================================
      # EXTRACT APK
      # ============================================================

      - name: Extract APK
        shell: bash
        run: |
          set -e

          OUT="$RUNNER_TEMP/apk-extracted"

          rm -rf "$OUT"

          mkdir -p "$OUT"

          echo "=== EXTRACT APK ==="

          unzip -q -o \
            "$APK" \
            -d "$OUT"

          echo "=== APK EXTRACTED ==="


      # ============================================================
      # FIND X-GAME
      # ============================================================

      - name: Prepare RenPy game
        shell: bash
        run: |
          set -e

          echo "=== FIND X-GAME ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"

            find "$RUNNER_TEMP/apk-extracted" \
              -maxdepth 5 \
              -type d

            exit 1
          fi

          echo "GAME:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME READY ==="


      # ============================================================
      # REMOVE COMPILED RPYC
      # ============================================================

      - name: Remove stale RPYC
        shell: bash
        run: |
          set -e

          echo "=== REMOVE RPYC ==="

          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            -delete

          echo "=== RPYC REMOVED ==="


      # ============================================================
      # CHECK GAME
      # ============================================================

      - name: Check game files
        shell: bash
        run: |
          set -e

          echo "=== GAME FILES ==="

          echo "RYP:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpy" \
            | wc -l

          echo "RPA:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpa" \
            | wc -l

          echo "GAME SIZE:"
          du -sh "$GITHUB_WORKSPACE/game"

          echo "=== GAME CHECK OK ==="


      # ============================================================
      # CREATE IOS PROJECT
      # ============================================================

      - name: Create iOS Xcode project
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          PROJECT="$GITHUB_WORKSPACE"

          DEST="$RUNNER_TEMP/ios-project"

          echo "=== IOS CREATE ==="

          echo "SDK:"
          echo "$SDK"

          echo "PROJECT:"
          echo "$PROJECT"

          echo "DEST:"
          echo "$DEST"

          # IMPORTANT:
          # Do not allow Ren'Py to ask:
          # "The Xcode project already exists..."
          #
          # We remove the destination before starting.

          rm -rf "$DEST"

          mkdir -p "$DEST"

          cd "$SDK"

          echo "=== CHECK RENIOS ==="

          test -d "$SDK/renios"

          test -f "$SDK/renios/hash.txt"

          test -f "$SDK/renios/buildlib/renios/__init__.py"

          echo "=== RUN RENPY IOS_CREATE ==="

          "$SDK/renpy.sh" \
            launcher \
            ios_create \
            "$PROJECT" \
            "$DEST"

          echo "=== IOS CREATE FINISHED ==="


      # ============================================================
      # VERIFY XCODE
      # ============================================================

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          echo "=== VERIFY XCODE PROJECT ==="

          XCODE=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$XCODE" ]; then

            echo "ERROR: XCODE PROJECT NOT FOUND"

            echo "=== IOS DIRECTORY ==="

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 7 \
              -print

            exit 1
          fi

          echo "=== XCODE PROJECT FOUND ==="

          echo "$XCODE"


      # ============================================================
      # ZIP
      # ============================================================

      - name: Archive iOS project
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -f MyBestDeal-4.7-iOS.zip

          echo "=== CREATE ZIP ==="

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            ios-project \
            MyBestDeal-4.7-iOS.zip

          test -f MyBestDeal-4.7-iOS.zip

          echo "=== ZIP READY ==="

          ls -lh MyBestDeal-4.7-iOS.zip


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/MyBestDeal-4.7-iOS.zip
          if-no-files-found: error