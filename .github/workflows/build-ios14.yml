name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RenPy 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf "$RUNNER_TEMP/renpy-sdk"
          mkdir -p "$RUNNER_TEMP/renpy-sdk"

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C "$RUNNER_TEMP/renpy-sdk"

          chmod +x "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          test -f "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          echo "=== RENPY OK ==="

      - name: Install RAPT 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          rm -rf "$RUNNER_TEMP/renpy-sdk/rapt"

          unzip -q -o rapt.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -f "$RUNNER_TEMP/renpy-sdk/rapt/buildlib/rapt/interface.py"

          echo "=== RAPT OK ==="

      - name: Install Renios 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          rm -rf "$RUNNER_TEMP/renpy-sdk/renios"

          unzip -q -o renios.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -d "$RUNNER_TEMP/renpy-sdk/renios"

          echo "=== RENIOS OK ==="

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== DOWNLOAD APK ==="
          echo "Release: mybestdeal47"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Extract APK
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"
          mkdir -p "$RUNNER_TEMP/apk-extracted"

          echo "=== EXTRACT APK ==="

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

      - name: Find and copy x-game
        run: |
          set -e

          echo "=== FIND x-game ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"
            exit 1
          fi

          echo "FOUND:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

      - name: Verify game
        run: |
          set -e

          echo "=== GAME CHECK ==="

          RPYC=$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l \
            | tr -d ' ')

          RPA=$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpa" \
            | wc -l \
            | tr -d ' ')

          echo "RPYC: $RPYC"
          echo "RPA: $RPA"

          if [ "$RPYC" -eq 0 ]; then
            echo "ERROR: NO RPYC FILES"
            exit 1
          fi

          echo ""
          echo "=== VERSION ==="

          cat "$GITHUB_WORKSPACE/game/x-script_version.txt" || true

          echo ""
          echo "=== BUILD INFO ==="

          cat "$GITHUB_WORKSPACE/game/x-cache/x-build_info.json" || true

      # ==========================================
      # PATCH ACTUAL RenPy iOS BUILDER
      # ==========================================

      - name: Patch iOS builder
        run: |
          set -e

          echo "=== FIND IOS.RPY ==="

          IOS=$(find "$RUNNER_TEMP/renpy-sdk" \
            -type f \
            -path "*/game/ios.rpy" \
            | head -1)

          if [ -z "$IOS" ]; then
            echo "ERROR: ios.rpy NOT FOUND"

            find "$RUNNER_TEMP/renpy-sdk" \
              -type f \
              -name "ios.rpy" \
              -print

            exit 1
          fi

          echo "IOS.RPY:"
          echo "$IOS"

          cp "$IOS" "$IOS.backup"

          python3 - "$IOS" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          old = "project.update_dump(force=True, gui=False, compile=project.data['force_recompile'])"
          new = "project.update_dump(force=False, gui=False, compile=False)"

          if old in data:
              data = data.replace(old, new)
              print("=== PATCH APPLIED ===")
          else:
              print("=== TARGET LINE NOT FOUND ===")
              print("Existing update_dump lines:")

              for line in data.splitlines():
                  if "update_dump" in line:
                      print(line)

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

          echo "=== PATCH CHECK ==="

          grep -n "update_dump" "$IOS" || true

      # ==========================================
      # CLEAN DESTINATION
      # ==========================================

      - name: Clean iOS destination
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"

          test ! -e "$RUNNER_TEMP/ios-project"

          echo "=== IOS DESTINATION CLEAN ==="

      # ==========================================
      # CREATE IOS
      # ==========================================

      - name: Create iOS project
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -e

          echo "=== IOS CREATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

          echo "=== IOS CREATE FINISHED ==="

      # ==========================================
      # VERIFY XCODE
      # ==========================================

      - name: Verify Xcode project
        run: |
          set -e

          echo "=== VERIFY XCODE ==="

          PROJECT=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1
          fi

          echo "XCODE PROJECT FOUND:"
          echo "$PROJECT"

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error