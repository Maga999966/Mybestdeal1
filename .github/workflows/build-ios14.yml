name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RenPy 8.0.1
        run: |
          set -e
          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renpy.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf "$RUNNER_TEMP/renpy-sdk"
          mkdir -p "$RUNNER_TEMP/renpy-sdk"

          tar -xjf renpy.tar.bz2 \
            --strip-components=1 \
            -C "$RUNNER_TEMP/renpy-sdk"

          chmod +x "$RUNNER_TEMP/renpy-sdk/renpy.sh"

      - name: Install RAPT
        run: |
          set -e
          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          unzip -q -o rapt.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -f "$RUNNER_TEMP/renpy-sdk/rapt/buildlib/rapt/interface.py"

      - name: Install Renios
        run: |
          set -e
          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -d "$RUNNER_TEMP/renpy-sdk/renios"

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          test -n "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Extract APK
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"
          mkdir -p "$RUNNER_TEMP/apk-extracted"

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

      - name: Prepare game
        run: |
          set -e

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          test -n "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== RPYC COUNT ==="

          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l

      # ==========================================
      # PATCH IOS CREATE
      # ==========================================

      - name: Patch RenPy iOS builder
        run: |
          set -e

          IOS=$(find "$RUNNER_TEMP/renpy-sdk" \
            -type f \
            -path "*/game/ios.rpy" \
            | head -1)

          if [ -z "$IOS" ]; then
            echo "ERROR: ios.rpy not found"
            find "$RUNNER_TEMP/renpy-sdk" \
              -type f \
              -name "ios.rpy" \
              -print
            exit 1
          fi

          echo "=== PATCHING ==="
          echo "$IOS"

          cp "$IOS" "$IOS.backup"

          python3 - "$IOS" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          # -------------------------------------------------
          # ios_create():
          #
          # ORIGINAL:
          # p.update_dump(force=True, gui=gui)
          #
          # REPLACE:
          # p.update_dump(force=False, gui=gui)
          # -------------------------------------------------

          old1 = "p.update_dump(force=True, gui=gui)"
          new1 = "p.update_dump(force=False, gui=gui)"

          if old1 in data:
              data = data.replace(old1, new1, 1)
              print("PATCH 1 APPLIED")
          else:
              print("PATCH 1 NOT FOUND")

          # -------------------------------------------------
          # Distributor:
          #
          # ORIGINAL:
          # project.update_dump(force=True, gui=False, compile=project.data['force_recompile'])
          #
          # REPLACE:
          # project.update_dump(force=False, gui=False, compile=False)
          # -------------------------------------------------

          old2 = "project.update_dump(force=True, gui=False, compile=project.data['force_recompile'])"
          new2 = "project.update_dump(force=False, gui=False, compile=False)"

          if old2 in data:
              data = data.replace(old2, new2, 1)
              print("PATCH 2 APPLIED")
          else:
              print("PATCH 2 NOT FOUND")

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          PY

          echo "=== PATCH CHECK ==="

          grep -n "update_dump" "$IOS" || true

      # ==========================================
      # CLEAN DESTINATION
      # ==========================================

      - name: Clean iOS destination
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"

          test ! -e "$RUNNER_TEMP/ios-project"

      # ==========================================
      # CREATE XCODE PROJECT
      # ==========================================

      - name: Create iOS project
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -e

          echo "=== IOS CREATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

          echo "=== IOS CREATE FINISHED ==="

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Xcode project
        run: |
          set -e

          echo "=== VERIFY XCODE ==="

          PROJECT=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 8 \
              -print

            exit 1
          fi

          echo "XCODE PROJECT FOUND:"
          echo "$PROJECT"

      # ==========================================
      # ARTIFACT
      # ==========================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error