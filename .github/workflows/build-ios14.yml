name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RenPy 8.0.1
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renpy.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf "$RUNNER_TEMP/renpy-sdk"

          mkdir -p "$RUNNER_TEMP/renpy-sdk"

          tar -xjf renpy.tar.bz2 \
            --strip-components=1 \
            -C "$RUNNER_TEMP/renpy-sdk"

          chmod +x "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          test -f "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          echo "=== RENPY OK ==="

      - name: Install RAPT
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          unzip -q -o rapt.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -f \
            "$RUNNER_TEMP/renpy-sdk/rapt/buildlib/rapt/interface.py"

          echo "=== RAPT OK ==="

      - name: Install Renios
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -d "$RUNNER_TEMP/renpy-sdk/renios"

          echo "=== RENIOS OK ==="

      - name: Download APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"

          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== DOWNLOAD APK ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Extract APK
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"

          mkdir -p "$RUNNER_TEMP/apk-extracted"

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "=== APK EXTRACTED ==="

      - name: Prepare game
        shell: bash
        run: |
          set -e

          echo "=== FIND x-game ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"
            exit 1
          fi

          echo "FOUND:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME READY ==="

          echo "RPYC COUNT:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l

      # ==========================================
      # FIND REAL RENPY FILES
      # ==========================================

      - name: Find RenPy builder files
        shell: bash
        run: |
          set -e

          echo "=== FIND ios.rpy ==="

          IOS=$(find "$RUNNER_TEMP/renpy-sdk" \
            -type f \
            -path "*/launcher/game/ios.rpy" \
            | head -1)

          if [ -z "$IOS" ]; then
            echo "ERROR: ios.rpy NOT FOUND"

            find "$RUNNER_TEMP/renpy-sdk" \
              -type f \
              -name "ios.rpy" \
              -print

            exit 1
          fi

          echo "IOS:"
          echo "$IOS"

          echo "IOS=$IOS" >> "$GITHUB_ENV"

          echo "=== FIND distribute.rpy ==="

          DISTRIBUTE=$(find "$RUNNER_TEMP/renpy-sdk" \
            -type f \
            -path "*/launcher/game/distribute.rpy" \
            | head -1)

          if [ -z "$DISTRIBUTE" ]; then
            echo "ERROR: distribute.rpy NOT FOUND"
            exit 1
          fi

          echo "DISTRIBUTE:"
          echo "$DISTRIBUTE"

          echo "DISTRIBUTE=$DISTRIBUTE" >> "$GITHUB_ENV"

      # ==========================================
      # PATCH DISTRIBUTE
      # ==========================================

      - name: Patch distribute.rpy
        shell: bash
        run: |
          set -e

          echo "=== PATCH DISTRIBUTE ==="

          cp "$DISTRIBUTE" "$DISTRIBUTE.backup"

          python3 - "$DISTRIBUTE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          old = "project.update_dump(force=True, gui=False, compile=project.data['force_recompile'])"

          new = "project.update_dump(force=False, gui=False, compile=False)"

          count = data.count(old)

          print("Occurrences:", count)

          if count:
              data = data.replace(old, new)

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          print("=== DISTRIBUTE PATCH DONE ===")
          PY

          echo "=== CHECK ==="

          grep -n "update_dump" "$DISTRIBUTE" || true

      # ==========================================
      # PATCH IOS
      # ==========================================

      - name: Patch ios.rpy
        shell: bash
        run: |
          set -e

          echo "=== PATCH IOS.RPY ==="

          cp "$IOS" "$IOS.backup"

          python3 - "$IOS" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          replacements = [
              (
                  "p.update_dump(force=True, gui=gui)",
                  "p.update_dump(force=False, gui=gui)"
              ),
              (
                  "p.update_dump(force=True, gui=False)",
                  "p.update_dump(force=False, gui=False)"
              ),
              (
                  "project.update_dump(force=True, gui=False, compile=project.data['force_recompile'])",
                  "project.update_dump(force=False, gui=False, compile=False)"
              )
          ]

          for old, new in replacements:

              count = data.count(old)

              print("Occurrences:", count)

              if count:
                  data = data.replace(old, new)

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          print("=== IOS PATCH DONE ===")
          PY

          echo "=== CHECK IOS ==="

          grep -n "update_dump" "$IOS" || true

      # ==========================================
      # CLEAN OLD PROJECT
      # ==========================================

      - name: Clean iOS destination
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"

          mkdir -p "$RUNNER_TEMP/ios-project"

          echo "=== DESTINATION CLEAN ==="

      # ==========================================
      # CREATE IOS PROJECT
      # ==========================================

      - name: Create iOS project
        shell: bash
        run: |
          set -e

          echo "=== IOS CREATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

          echo "=== IOS CREATE FINISHED ==="

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          echo "=== VERIFY XCODE ==="

          PROJECT=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 8 \
              -print

            exit 1
          fi

          echo "XCODE PROJECT FOUND:"
          echo "$PROJECT"

      # ==========================================
      # UPLOAD
      # ==========================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error