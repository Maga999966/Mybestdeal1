name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # RENPY SDK
      # ==========================================

      - name: Download RenPy 8.0.1 SDK
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "=== DOWNLOAD RENPY 8.0.1 ==="

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf "$RUNNER_TEMP/renpy-sdk"

          mkdir -p "$RUNNER_TEMP/renpy-sdk"

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C "$RUNNER_TEMP/renpy-sdk"

          test -f "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          chmod +x "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          echo "=== RENPY SDK OK ==="

      # ==========================================
      # RAPT
      # ==========================================

      - name: Install RAPT 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "=== DOWNLOAD RAPT 8.0.1 ==="

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          rm -rf "$RUNNER_TEMP/renpy-sdk/rapt"

          unzip -q -o rapt.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -d "$RUNNER_TEMP/renpy-sdk/rapt"
          test -d "$RUNNER_TEMP/renpy-sdk/rapt/buildlib"

          echo "=== RAPT OK ==="

      # ==========================================
      # RENIOS
      # ==========================================

      - name: Install Renios 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          echo "=== DOWNLOAD RENIOS 8.0.1 ==="

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          rm -rf "$RUNNER_TEMP/renpy-sdk/renios"

          unzip -q -o renios.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -d "$RUNNER_TEMP/renpy-sdk/renios"
          test -d "$RUNNER_TEMP/renpy-sdk/renios/buildlib"

          echo "=== RENIOS OK ==="

      # ==========================================
      # VERIFY IOS TOOLS
      # ==========================================

      - name: Verify iOS tools
        run: |
          set -e

          cd "$RUNNER_TEMP/renpy-sdk"

          echo "=== VERIFY IOS TOOLS ==="

          test -d rapt
          test -d rapt/buildlib

          test -d renios
          test -d renios/buildlib

          test -f rapt/buildlib/rapt/interface.py

          echo "RAPT: OK"
          echo "RENIOS: OK"

      # ==========================================
      # DOWNLOAD APK
      # ==========================================

      - name: Download APK from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== DOWNLOAD APK ==="
          echo "Release: mybestdeal47"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "=== APK FOUND ==="
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # EXTRACT APK
      # ==========================================

      - name: Extract APK
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"

          mkdir -p "$RUNNER_TEMP/apk-extracted"

          echo "=== EXTRACT APK ==="

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "APK extracted successfully"

      # ==========================================
      # FIND X-GAME
      # ==========================================

      - name: Find x-game
        run: |
          set -e

          echo "=== FIND x-game ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"

            find "$RUNNER_TEMP/apk-extracted" \
              -maxdepth 6 \
              -type d \
              | sort

            exit 1
          fi

          echo "x-game found:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "x-game copied"

      # ==========================================
      # VERIFY GAME
      # ==========================================

      - name: Verify game
        run: |
          set -e

          echo "=== VERIFY GAME ==="

          RPYC=$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l \
            | tr -d ' ')

          RPA=$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpa" \
            | wc -l \
            | tr -d ' ')

          echo "RPYC COUNT: $RPYC"
          echo "RPA COUNT: $RPA"

          if [ "$RPYC" -eq 0 ]; then
            echo "ERROR: No RPYC files found"
            exit 1
          fi

          echo ""
          echo "=== SCRIPT VERSION ==="

          if [ -f "$GITHUB_WORKSPACE/game/x-script_version.txt" ]; then
            cat "$GITHUB_WORKSPACE/game/x-script_version.txt"
          fi

          echo ""
          echo "=== BUILD INFO ==="

          if [ -f "$GITHUB_WORKSPACE/game/x-cache/x-build_info.json" ]; then
            cat "$GITHUB_WORKSPACE/game/x-cache/x-build_info.json"
          fi

      # ==========================================
      # CLEAN IOS DESTINATION
      # ==========================================

      - name: Clean iOS destination
        run: |
          set -e

          echo "=== CLEAN IOS DESTINATION ==="

          # ВАЖНО:
          # ios_create должен получить НЕСУЩЕСТВУЮЩУЮ папку.
          # Поэтому здесь мы только удаляем её,
          # но НЕ создаём заново.

          rm -rf "$RUNNER_TEMP/ios-project"

          if [ -e "$RUNNER_TEMP/ios-project" ]; then
            echo "ERROR: ios-project still exists"
            exit 1
          fi

          echo "Destination is clean"

      # ==========================================
      # IOS CREATE
      # ==========================================

      - name: Create iOS project
        run: |
          set -e

          echo "=== IOS CREATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          chmod +x renpy.sh

          ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

          echo "=== IOS CREATE FINISHED ==="

      # ==========================================
      # IOS POPULATE
      # ==========================================

      - name: Populate iOS project
        run: |
          set -e

          echo "=== IOS POPULATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          ./renpy.sh launcher ios_populate \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

          echo "=== IOS POPULATE FINISHED ==="

      # ==========================================
      # VERIFY XCODE
      # ==========================================

      - name: Verify Xcode project
        run: |
          set -e

          echo "=== VERIFY XCODE PROJECT ==="

          XCODE_PROJECT=$(find "$RUNNER_TEMP/ios-project" \
            -maxdepth 8 \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$XCODE_PROJECT" ]; then
            echo "ERROR: Xcode project was not created"

            echo "=== IOS PROJECT CONTENT ==="

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 8 \
              -print \
              | sort

            exit 1
          fi

          echo "Xcode project found:"
          echo "$XCODE_PROJECT"

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error