name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # RENPY
      # ==========================================

      - name: Download RenPy 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renpy.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf "$RUNNER_TEMP/renpy-sdk"

          mkdir "$RUNNER_TEMP/renpy-sdk"

          tar -xjf renpy.tar.bz2 \
            --strip-components=1 \
            -C "$RUNNER_TEMP/renpy-sdk"

          chmod +x "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          test -f "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          echo "=== RENPY OK ==="

      # ==========================================
      # RAPT
      # ==========================================

      - name: Install RAPT
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          rm -rf "$RUNNER_TEMP/renpy-sdk/rapt"

          unzip -q -o rapt.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -f "$RUNNER_TEMP/renpy-sdk/rapt/buildlib/rapt/interface.py"

          echo "=== RAPT OK ==="

      # ==========================================
      # RENIOS
      # ==========================================

      - name: Install Renios
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          rm -rf "$RUNNER_TEMP/renpy-sdk/renios"

          unzip -q -o renios.zip \
            -d "$RUNNER_TEMP/renpy-sdk"

          test -d "$RUNNER_TEMP/renpy-sdk/renios"

          echo "=== RENIOS OK ==="

      # ==========================================
      # APK
      # ==========================================

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== DOWNLOAD APK ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          test -n "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK"

      # ==========================================
      # EXTRACT
      # ==========================================

      - name: Extract APK
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"

          mkdir "$RUNNER_TEMP/apk-extracted"

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

      # ==========================================
      # COPY GAME
      # ==========================================

      - name: Prepare game
        run: |
          set -e

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game not found"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME ==="

          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l

      # ==========================================
      # PATCH IOS.RPY
      # ==========================================

      - name: Patch RenPy iOS builder
        run: |
          set -e

          IOS="$RUNNER_TEMP/renpy-sdk/renpy/common/ios.rpy"

          if [ ! -f "$IOS" ]; then
            echo "ERROR: ios.rpy not found"
            exit 1
          fi

          echo "=== PATCH IOS BUILDER ==="

          cp "$IOS" "$IOS.backup"

          python3 - "$IOS" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          old = "project.update_dump(force=True, gui=False, compile=project.data['force_recompile'])"

          new = "project.update_dump(force=False, gui=False, compile=False)"

          if old not in data:
              print("WARNING: target line not found")
          else:
              data = data.replace(old, new)
              print("Patch applied.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

          echo "=== CHECK PATCH ==="

          grep -n "update_dump" "$IOS" || true

      # ==========================================
      # IOS DESTINATION
      # ==========================================

      - name: Prepare iOS destination
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"

          test ! -e "$RUNNER_TEMP/ios-project"

          echo "=== DESTINATION READY ==="

      # ==========================================
      # IOS CREATE
      # ==========================================

      - name: Create iOS project
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -e

          echo "=== IOS CREATE ==="

          cd "$RUNNER_TEMP/renpy-sdk"

          ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

          echo "=== IOS CREATE FINISHED ==="

      # ==========================================
      # VERIFY
      # ==========================================

      - name: Verify Xcode project
        run: |
          set -e

          echo "=== VERIFY XCODE ==="

          PROJECT=$(find "$RUNNER_TEMP/ios-project" \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "Xcode project:"
          echo "$PROJECT"

      # ==========================================
      # ARTIFACT
      # ==========================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error