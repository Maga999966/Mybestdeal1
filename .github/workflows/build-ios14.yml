name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # RENPY 8.0.1 + RAPT + RENIOS
      # ============================================================

      - name: Install RenPy 8.0.1
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -rf renpy-sdk
          rm -f renpy-sdk.tar.bz2
          rm -f rapt.zip
          rm -f renios.zip

          echo "=== DOWNLOAD RENPY 8.0.1 ==="

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          mkdir renpy-sdk

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C renpy-sdk

          echo "=== DOWNLOAD RAPT ==="

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          unzip -q -o rapt.zip -d renpy-sdk

          echo "=== DOWNLOAD RENIOS ==="

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip -d renpy-sdk

          chmod +x renpy-sdk/renpy.sh

          echo "=== VERIFY RENPY ==="

          test -f renpy-sdk/renpy.sh
          test -d renpy-sdk/rapt
          test -d renpy-sdk/renios
          test -d renpy-sdk/renios/buildlib

          echo "=== VERIFY RENIOS MODULES ==="

          test -f renpy-sdk/renios/buildlib/renios/__init__.py
          test -f renpy-sdk/renios/buildlib/renios/create.py
          test -f renpy-sdk/renios/buildlib/renios/image.py

          echo "=== RENPY READY ==="

      # ============================================================
      # APK
      # ============================================================

      - name: Download APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=== APK FOUND ==="
          echo "$APK"

      # ============================================================
      # EXTRACT APK
      # ============================================================

      - name: Extract APK
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"
          mkdir -p "$RUNNER_TEMP/apk-extracted"

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "=== APK EXTRACTED ==="

      # ============================================================
      # PREPARE GAME
      # ============================================================

      - name: Prepare RenPy game
        shell: bash
        run: |
          set -e

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"
            exit 1
          fi

          echo "GAME:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME READY ==="

          echo "RYP:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpy" \
            | wc -l

          echo "RPYC:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l

          echo "RPA:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpa" \
            | wc -l

      # ============================================================
      # REMOVE OLD COMPILED FILES
      # ============================================================

      - name: Remove stale RPYC
        shell: bash
        run: |
          set -e

          echo "=== REMOVE STALE RPYC ==="

          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            -delete

          echo "=== RPYC REMOVED ==="

      # ============================================================
      # PREPARE RENIOS PYTHON PATH
      # ============================================================

      - name: Prepare RenIOS environment
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          export PYTHONPATH="$SDK/renios/buildlib:$SDK/rapt/buildlib:$SDK:$PYTHONPATH"

          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"

          echo "=== TEST RENIOS IMPORT ==="

          "$SDK/renpy" -c "
          import sys
          sys.path.insert(0, '$SDK/renios/buildlib')
          import renios
          import renios.create
          import renios.image
          print('REN IOS IMPORT OK')
          "

      # ============================================================
      # CREATE IOS PROJECT
      # ============================================================

      - name: Create iOS project
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          RENPY_RENDERER: sw
        run: |
          set -e

          echo "=== IOS CREATE ==="

          SDK="$RUNNER_TEMP/renpy-sdk"
          DEST="$RUNNER_TEMP/ios-project"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          cd "$SDK"

          echo "SDK:"
          pwd

          echo "PROJECT:"
          echo "$GITHUB_WORKSPACE"

          echo "DEST:"
          echo "$DEST"

          echo "=== RUN IOS_CREATE ==="

          PYTHONPATH="$SDK/renios/buildlib:$SDK/rapt/buildlib:$SDK" \
          "$SDK/renpy.sh" \
            launcher \
            ios_create \
            "$GITHUB_WORKSPACE" \
            "$DEST" <<'EOF'
yes
EOF

          echo "=== IOS CREATE FINISHED ==="

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          echo "=== VERIFY XCODE ==="

          XCODE=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "=== XCODE FOUND ==="
          echo "$XCODE"

      # ============================================================
      # ZIP
      # ============================================================

      - name: Archive iOS project
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -f MyBestDeal-4.7-iOS.zip

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            ios-project \
            MyBestDeal-4.7-iOS.zip

          test -f MyBestDeal-4.7-iOS.zip

          echo "=== ZIP READY ==="
          ls -lh MyBestDeal-4.7-iOS.zip

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/MyBestDeal-4.7-iOS.zip
          if-no-files-found: error