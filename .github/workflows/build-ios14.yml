name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RenPy 8.0.1
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -rf renpy-sdk
          rm -f renpy-sdk.tar.bz2 rapt.zip renios.zip

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          mkdir -p renpy-sdk

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C renpy-sdk

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          unzip -q -o rapt.zip -d renpy-sdk

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip -d renpy-sdk

          chmod +x "$RUNNER_TEMP/renpy-sdk/renpy.sh"

          test -f "$RUNNER_TEMP/renpy-sdk/renpy.sh"
          test -d "$RUNNER_TEMP/renpy-sdk/rapt"
          test -d "$RUNNER_TEMP/renpy-sdk/renios"

          echo "RENPY READY"

      - name: Download APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Extract APK
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"
          mkdir -p "$RUNNER_TEMP/apk-extracted"

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

      - name: Prepare RenPy game
        shell: bash
        run: |
          set -e

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "GAME READY"

      - name: Remove stale RPYC
        shell: bash
        run: |
          set -e

          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            -delete

      - name: Create iOS project
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          RENPY_RENDERER: sw
        run: |
          set -e

          echo "=== IOS CREATE ==="

          SDK="$RUNNER_TEMP/renpy-sdk"
          PROJECT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/ios-project"

          rm -rf "$DEST"

          cd "$SDK"

          echo "SDK: $SDK"
          echo "PROJECT: $PROJECT"
          echo "DEST: $DEST"

          printf 'yes\n' | \
            "$SDK/renpy.sh" \
            launcher \
            ios_create \
            "$PROJECT" \
            "$DEST"

          echo "=== IOS CREATE FINISHED ==="

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          XCODE=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 8 \
              -print

            exit 1
          fi

          echo "XCODE FOUND:"
          echo "$XCODE"

      - name: Archive iOS project
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -f MyBestDeal-4.7-iOS.zip

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            ios-project \
            MyBestDeal-4.7-iOS.zip

          test -f MyBestDeal-4.7-iOS.zip

          ls -lh MyBestDeal-4.7-iOS.zip

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/MyBestDeal-4.7-iOS.zip
          if-no-files-found: error