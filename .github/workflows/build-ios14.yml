name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # RENPY 8.0.1
      # ============================================================

      - name: Download RenPy 8.0.1
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          rm -rf "$SDK"
          rm -f "$RUNNER_TEMP/renpy-sdk.tar.bz2"

          echo "=== DOWNLOAD RENPY 8.0.1 ==="

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/renpy-sdk.tar.bz2" \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          mkdir -p "$SDK"

          tar -xjf "$RUNNER_TEMP/renpy-sdk.tar.bz2" \
            --strip-components=1 \
            -C "$SDK"

          chmod +x "$SDK/renpy.sh"

          test -f "$SDK/renpy.sh"

          echo "=== RENPY SDK OK ==="

      # ============================================================
      # RAPT
      # ============================================================

      - name: Download RAPT
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/rapt.zip" \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          unzip -q -o \
            "$RUNNER_TEMP/rapt.zip" \
            -d "$SDK"

          test -d "$SDK/rapt"

          echo "=== RAPT OK ==="

      # ============================================================
      # RENIOS
      # ============================================================

      - name: Download RenIOS
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/renios.zip" \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o \
            "$RUNNER_TEMP/renios.zip" \
            -d "$SDK"

          test -d "$SDK/renios"

          echo "=== RENIOS OK ==="

      # ============================================================
      # VERIFY SDK
      # ============================================================

      - name: Verify RenPy
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          echo "=== VERIFY SDK ==="

          test -x "$SDK/renpy.sh"
          test -d "$SDK/rapt"
          test -d "$SDK/renios"
          test -d "$SDK/renios/buildlib"

          test -f "$SDK/renios/buildlib/renios/__init__.py"
          test -f "$SDK/renios/buildlib/renios/create.py"

          echo "SDK:"
          "$SDK/renpy.sh" --version || true

          echo "=== SDK READY ==="

      # ============================================================
      # DOWNLOAD APK
      # ============================================================

      - name: Download APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK_DIR="$RUNNER_TEMP/apk"

          rm -rf "$APK_DIR"
          mkdir -p "$APK_DIR"

          echo "=== DOWNLOAD APK ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$APK_DIR"

          APK=$(find "$APK_DIR" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK"

      # ============================================================
      # EXTRACT APK
      # ============================================================

      - name: Extract APK
        shell: bash
        run: |
          set -e

          OUT="$RUNNER_TEMP/apk-extracted"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          unzip -q -o \
            "$APK" \
            -d "$OUT"

          echo "=== APK EXTRACTED ==="

      # ============================================================
      # FIND X-GAME
      # ============================================================

      - name: Prepare game
        shell: bash
        run: |
          set -e

          SRC=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$SRC" ]; then
            echo "ERROR: x-game NOT FOUND"
            find "$RUNNER_TEMP/apk-extracted" \
              -maxdepth 4 \
              -type d
            exit 1
          fi

          echo "GAME SOURCE:"
          echo "$SRC"

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$SRC"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME READY ==="

      # ============================================================
      # REMOVE OLD RPYC
      # ============================================================

      - name: Remove compiled RPYC
        shell: bash
        run: |
          set -e

          echo "=== REMOVE RPYC ==="

          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            -delete

          echo "=== RPYC REMOVED ==="

      # ============================================================
      # PREPARE RENIOS
      # ============================================================

      - name: Prepare RenIOS
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"

          echo "=== RENIOS ==="

          find "$SDK/renios" \
            -maxdepth 3 \
            -type f \
            | head -50

          test -f "$SDK/renios/buildlib/renios/__init__.py"
          test -f "$SDK/renios/buildlib/renios/create.py"

          echo "=== RENIOS READY ==="

      # ============================================================
      # CREATE IOS PROJECT
      # ============================================================

      - name: Create iOS project
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          RENPY_RENDERER: sw
        run: |
          set -e

          SDK="$RUNNER_TEMP/renpy-sdk"
          PROJECT="$GITHUB_WORKSPACE"
          DEST="$RUNNER_TEMP/ios-project"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo "=== IOS CREATE ==="
          echo "SDK: $SDK"
          echo "PROJECT: $PROJECT"
          echo "DEST: $DEST"

          cd "$SDK"

          export PYTHONPATH="$SDK/renios/buildlib:$SDK/rapt/buildlib:$SDK"

          echo "=== RUN RENPY ==="

          "$SDK/renpy.sh" \
            launcher \
            ios_create \
            "$PROJECT" \
            "$DEST" <<'EOF'
yes
EOF

          echo "=== IOS CREATE FINISHED ==="

      # ============================================================
      # VERIFY XCODE
      # ============================================================

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          echo "=== VERIFY XCODE ==="

          XCODE=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "=== XCODE FOUND ==="
          echo "$XCODE"

      # ============================================================
      # ZIP
      # ============================================================

      - name: Archive iOS project
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          rm -f MyBestDeal-4.7-iOS.zip

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            ios-project \
            MyBestDeal-4.7-iOS.zip

          test -f MyBestDeal-4.7-iOS.zip

          echo "=== ZIP READY ==="
          ls -lh MyBestDeal-4.7-iOS.zip

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/MyBestDeal-4.7-iOS.zip
          if-no-files-found: error