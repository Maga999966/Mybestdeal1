name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DOWNLOAD RENPY 8.0.1
      # ============================================================

      - name: Download RenPy 8.0.1
        shell: bash
        run: |
          set -e

          echo "=== DOWNLOAD RENPY 8.0.1 ==="

          cd "$RUNNER_TEMP"

          rm -rf renpy-sdk
          rm -f renpy-sdk.tar.bz2

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          mkdir -p renpy-sdk

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C renpy-sdk

          chmod +x renpy-sdk/renpy.sh

          test -f renpy-sdk/renpy.sh

          echo "=== RENPY SDK OK ==="

      # ============================================================
      # DOWNLOAD RAPT
      # ============================================================

      - name: Download RAPT
        shell: bash
        run: |
          set -e

          echo "=== DOWNLOAD RAPT ==="

          cd "$RUNNER_TEMP"

          rm -f rapt.zip

          curl -L --fail \
            -o rapt.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-rapt.zip

          unzip -q -o rapt.zip \
            -d renpy-sdk

          echo "=== RAPT OK ==="

      # ============================================================
      # DOWNLOAD RENIOS
      # ============================================================

      - name: Download Renios
        shell: bash
        run: |
          set -e

          echo "=== DOWNLOAD RENIOS ==="

          cd "$RUNNER_TEMP"

          rm -f renios.zip

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip \
            -d renpy-sdk

          test -d renpy-sdk/renios

          echo "=== RENIOS OK ==="

      # ============================================================
      # CHECK RENPY IOS SUPPORT
      # ============================================================

      - name: Check RenPy iOS support
        shell: bash
        run: |
          set -e

          echo "=== CHECK RENIOS ==="

          test -d "$RUNNER_TEMP/renpy-sdk/renios"

          find "$RUNNER_TEMP/renpy-sdk/renios" \
            -maxdepth 3 \
            -type f \
            | head -50

          echo "=== RENIOS FOUND ==="

      # ============================================================
      # DOWNLOAD APK FROM RELEASE
      # ============================================================

      - name: Download APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=== DOWNLOAD APK ==="

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # EXTRACT APK
      # ============================================================

      - name: Extract APK
        shell: bash
        run: |
          set -e

          echo "=== EXTRACT APK ==="

          rm -rf "$RUNNER_TEMP/apk-extracted"

          mkdir -p "$RUNNER_TEMP/apk-extracted"

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "=== APK EXTRACTED ==="

      # ============================================================
      # FIND X-GAME
      # ============================================================

      - name: Find x-game
        shell: bash
        run: |
          set -e

          echo "=== FIND X-GAME ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ERROR: x-game NOT FOUND"
            exit 1
          fi

          echo "FOUND:"
          echo "$GAME"

          echo "GAME=$GAME" >> "$GITHUB_ENV"

      # ============================================================
      # PREPARE RENPY GAME
      # ============================================================

      - name: Prepare RenPy game
        shell: bash
        run: |
          set -e

          echo "=== PREPARE GAME ==="

          rm -rf "$GITHUB_WORKSPACE/game"

          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

          echo "=== GAME READY ==="

          echo "RPYC COUNT:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l

          echo "RPA COUNT:"
          find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpa" \
            | wc -l

      # ============================================================
      # REMOVE OLD XCODE PROJECTS FROM GAME
      # ============================================================

      - name: Remove old iOS projects
        shell: bash
        run: |
          set -e

          echo "=== REMOVE OLD IOS PROJECTS ==="

          find "$GITHUB_WORKSPACE" \
            -type d \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -prune \
            -exec rm -rf {} \; \
            2>/dev/null || true

          rm -rf "$RUNNER_TEMP/ios-project"

          echo "=== OLD PROJECTS REMOVED ==="

      # ============================================================
      # FIND IOS.RPY
      # ============================================================

      - name: Check iOS builder
        shell: bash
        run: |
          set -e

          echo "=== CHECK IOS.RPY ==="

          IOS_RPY=$(find "$RUNNER_TEMP/renpy-sdk" \
            -type f \
            -path "*/launcher/game/ios.rpy" \
            | head -1)

          if [ -z "$IOS_RPY" ]; then
            echo "ERROR: ios.rpy NOT FOUND"
            exit 1
          fi

          echo "IOS.RPY:"
          echo "$IOS_RPY"

      # ============================================================
      # CREATE CLEAN IOS PROJECT
      # ============================================================

      - name: Create iOS project
        shell: bash
        run: |
          set -e

          echo "=== IOS CREATE ==="

          IOS_OUT="$RUNNER_TEMP/ios-project"

          # VERY IMPORTANT:
          # destination must NOT exist before ios_create.

          rm -rf "$IOS_OUT"

          test ! -e "$IOS_OUT"

          cd "$RUNNER_TEMP/renpy-sdk"

          echo "SDK:"
          pwd

          echo "PROJECT:"
          echo "$GITHUB_WORKSPACE"

          echo "DESTINATION:"
          echo "$IOS_OUT"

          echo "=== RUN RENPY IOS_CREATE ==="

          # RenPy 8.0.1 official command:
          #
          # ./renpy.sh launcher ios_create <basedir> <destination>
          #
          # yes is supplied only as a fallback for the
          # old-project question.

          yes yes | ./renpy.sh launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$IOS_OUT" || {
              STATUS=$?

              echo "RenPy returned: $STATUS"

              if [ -d "$IOS_OUT" ]; then
                echo "iOS project directory exists."
              else
                exit "$STATUS"
              fi
            }

          echo "=== IOS CREATE FINISHED ==="

      # ============================================================
      # VERIFY XCODE PROJECT
      # ============================================================

      - name: Verify Xcode project
        shell: bash
        run: |
          set -e

          echo "=== VERIFY XCODE PROJECT ==="

          if [ ! -d "$RUNNER_TEMP/ios-project" ]; then
            echo "ERROR: IOS PROJECT DIRECTORY NOT FOUND"
            exit 1
          fi

          XCODE_PROJECT=$(find "$RUNNER_TEMP/ios-project" \
            -type d \
            -name "*.xcodeproj" \
            | head -1)

          if [ -z "$XCODE_PROJECT" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"

            echo "FILES:"
            find "$RUNNER_TEMP/ios-project" \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "=== XCODE PROJECT FOUND ==="
          echo "$XCODE_PROJECT"

      # ============================================================
      # ZIP IOS PROJECT
      # ============================================================

      - name: Archive iOS project
        shell: bash
        run: |
          set -e

          echo "=== ARCHIVE IOS PROJECT ==="

          cd "$RUNNER_TEMP"

          rm -f MyBestDeal-4.7-iOS.zip

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            ios-project \
            MyBestDeal-4.7-iOS.zip

          test -f MyBestDeal-4.7-iOS.zip

          ls -lh MyBestDeal-4.7-iOS.zip

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/MyBestDeal-4.7-iOS.zip
          if-no-files-found: error