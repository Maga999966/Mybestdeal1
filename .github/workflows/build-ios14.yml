name: Build iOS 14 - My Best Deal 4.7

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:

      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Создать Python окружение
        run: |
          set -e

          python3 -m venv "$RUNNER_TEMP/venv"

          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install future

          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Скачать RenPy 8.0.1
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renpy-sdk.tar.bz2 \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-sdk.tar.bz2

          rm -rf renpy-sdk
          mkdir -p renpy-sdk

          tar -xjf renpy-sdk.tar.bz2 \
            --strip-components=1 \
            -C renpy-sdk

          test -f "$RUNNER_TEMP/renpy-sdk/renpy.py"

          echo "RenPy SDK OK"

      - name: Скачать Renios
        run: |
          set -e

          cd "$RUNNER_TEMP"

          curl -L --fail \
            -o renios.zip \
            https://www.renpy.org/dl/8.0.1/renpy-8.0.1-renios.zip

          unzip -q -o renios.zip \
            -d renpy-sdk

          test -d "$RUNNER_TEMP/renpy-sdk/renios"

          echo "Renios OK"

      - name: Скачать APK из Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"

          echo "=== RELEASE mybestdeal47 ==="

          gh release download mybestdeal47 \
            --repo "${{ github.repository }}" \
            --pattern "*.apk" \
            --dir "$RUNNER_TEMP/apk"

          APK=$(find "$RUNNER_TEMP/apk" \
            -type f \
            -iname "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            exit 1
          fi

          echo "APK найден:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Распаковать APK
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk-extracted"
          mkdir -p "$RUNNER_TEMP/apk-extracted"

          echo "=== РАСПАКОВКА APK ==="

          unzip -q -o "$APK" \
            -d "$RUNNER_TEMP/apk-extracted"

          echo "APK успешно распакован"

      - name: Найти x-game
        run: |
          set -e

          echo "=== ПОИСК x-game ==="

          GAME=$(find "$RUNNER_TEMP/apk-extracted" \
            -type d \
            -name "x-game" \
            | head -1)

          if [ -z "$GAME" ]; then
            echo "ОШИБКА: x-game не найден"
            exit 1
          fi

          echo "x-game найден:"
          echo "$GAME"

          rm -rf "$GITHUB_WORKSPACE/game"
          mkdir -p "$GITHUB_WORKSPACE/game"

          cp -R "$GAME"/. \
            "$GITHUB_WORKSPACE/game"/

      - name: Проверить игру
        run: |
          set -e

          echo "=== ПРОВЕРКА ИГРЫ ==="

          RPYC=$(find "$GITHUB_WORKSPACE/game" \
            -type f \
            -name "*.rpyc" \
            | wc -l \
            | tr -d ' ')

          echo "RPYC файлов: $RPYC"

          if [ "$RPYC" -eq 0 ]; then
            echo "ОШИБКА: RPYC не найдены"
            exit 1
          fi

          echo "=== ВЕРСИЯ ==="
          cat "$GITHUB_WORKSPACE/game/x-script_version.txt" || true

          echo "=== BUILD INFO ==="
          cat "$GITHUB_WORKSPACE/game/x-cache/x-build_info.json" || true

      - name: Проверить RenPy
        run: |
          set -e

          cd "$RUNNER_TEMP/renpy-sdk"

          echo "=== ПРОВЕРКА RENPY ==="

          "$PYTHON" -c "import future; print('future: OK')"
          "$PYTHON" -c "import renpy; print('renpy: OK')"

      - name: Создать iOS проект
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/ios-project"
          mkdir -p "$RUNNER_TEMP/ios-project"

          cd "$RUNNER_TEMP/renpy-sdk"

          echo "=== IOS CREATE ==="

          "$PYTHON" renpy.py launcher ios_create \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Заполнить iOS проект
        run: |
          set -e

          cd "$RUNNER_TEMP/renpy-sdk"

          echo "=== IOS POPULATE ==="

          "$PYTHON" renpy.py launcher ios_populate \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ios-project"

      - name: Проверить Xcode проект
        run: |
          set -e

          echo "=== XCODE PROJECT ==="

          find "$RUNNER_TEMP/ios-project" \
            -maxdepth 6 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Загрузить iOS проект
        uses: actions/upload-artifact@v4
        with:
          name: MyBestDeal-4.7-iOS
          path: ${{ runner.temp }}/ios-project/
          if-no-files-found: error